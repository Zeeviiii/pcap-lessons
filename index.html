/* remote copy: read, merge, then write; one write at a time; a failure is retried, never lost */
var remoteRef=null,pushTimer=null,pushBusy=false,pushAgain=false,syncFail=0;
function readRemote(ref){
  return ref.get().then(function(snap){
    var d=snap&&snap.exists?snap.data():null;
    if(d&&typeof d.json==="string"){try{return normalize(JSON.parse(d.json));}catch(e){}}
    return null;
  });
}
function pushRemote(delay){
  if(!remoteRef)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){
    if(pushBusy){pushAgain=true;return;}
    pushBusy=true;
    var ref=remoteRef,ok=false;
    readRemote(ref).then(function(rem){
      if(rem){S=mergeState(S,rem);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
      return ref.set({json:JSON.stringify(S),t:S.t});
    }).then(function(){ok=true;syncFail=0;},function(){syncFail++;}).then(function(){
      pushBusy=false;
      if(pushAgain){pushAgain=false;pushRemote();}
      else if(!ok&&syncFail<6)pushRemote(Math.min(60000,5000*syncFail));
    });
  },delay||800);
}
/* merge two copies question by question: for each question, the copy that answered it last wins */
function mergeState(a,b){
  a=normalize(a);b=normalize(b);
  /* after a full reset, keep only what was answered after it, on any device */
  var rst=Math.max(a.reset,b.reset);
  function afterReset(c,id){return !rst||(c.at[id]||0)>rst;}
  var out=normalize(null);out.t=Math.max(a.t,b.t);out.reset=rst;
  function has(c,id){return !!(c.done[id]||c.bad[id]||c.rev[id]||(id in c.last)||c.mast[id]||c.at[id]);}
  var nw=b.t>a.t?b:a, od=nw===a?b:a, ids={};
  [a,b].forEach(function(c){["done","bad","rev","last","mast","at","pv"].forEach(function(f){for(var k in c[f])ids[k]=1;});});
  for(var id in ids){
    var ta=a.at[id]||0, tb=b.at[id]||0;
    /* a copy that never saw this question has nothing to say about it; otherwise the later answer wins, then the newer copy */
    var ha=has(a,id),hb=has(b,id);
    var win=!hb?a:!ha?b:ta>tb?a:tb>ta?b:nw;
    if(!afterReset(win,id)){var other=win===a?b:a;if(afterReset(other,id))win=other;else continue;}
    if(a.done[id]&&afterReset(a,id)||b.done[id]&&afterReset(b,id))out.done[id]=true;
    if(win.bad[id])out.bad[id]=true;
    if(win.rev[id]&&win.bad[id])out.rev[id]=win.rev[id];
    if(id in win.last)out.last[id]=win.last[id];
    if(win.mast[id])out.mast[id]=win.mast[id];
    if(win.pv[id])out.pv[id]=1;
    var t=Math.max(ta,tb);if(t)out.at[id]=t;
  }
  [a.seen,b.seen].forEach(function(m){for(var k5 in m)if(!rst||m[k5]>rst)out.seen[k5]=Math.max(out.seen[k5]||0,m[k5]);});
  var seenEx={};
  a.exams.concat(b.exams).forEach(function(r){if(rst&&r.ts<=rst)return;var key=r.ts||(r.d+"|"+r.s+"|"+r.n);if(!seenEx[key]){seenEx[key]=1;out.exams.push(r);}});
  out.exams.sort(function(x,y){return (x.ts||0)-(y.ts||0);});
  return normalize(out);
}

/* cross-device sync: private per-person document; the first read is retried a few times */
(function(){
  if(!window.claude||typeof claude.use!=="function")return;
  var tries=0;
  function start(db,user){
    return user.id().then(function(id){
      if(!id)return;
      var ref=db.collection("data/users/"+id).doc("pcap");
      return readRemote(ref).then(function(rem){
        remoteRef=ref;syncFail=0;
        if(rem){
          var before=JSON.stringify(S);
          S=mergeState(S,rem);
          try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
          if(JSON.stringify(S)!==JSON.stringify(rem))pushRemote();
          if(JSON.stringify(S)!==before&&view==="home")home();
        }else if(S.t){pushRemote();}
      });
    }).catch(function(){syncFail++;if(++tries<4)setTimeout(function(){start(db,user);},5000*tries);});
  }
  try{Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    if(r[0]&&r[1])start(r[0],r[1]);
  }).catch(function(){});}catch(e){}
})();

/* ---------- spaced repetition: a mistake comes back now, then after 1, 3 and 7 days ---------- */
var DAY=86400000, GAPS=[0,1,3,7];
function markWrong(id){S.bad[id]=true;S.rev[id]={l:0,due:Date.now()};}
function markRight(id){
  if(!S.bad[id])return;
  var r=S.rev[id]||{l:0,due:0};
  if(r.due>Date.now())return;            /* not due yet: practice does not move it */
  var l=r.l+1;
  if(l>=GAPS.length){delete S.bad[id];delete S.rev[id];return;}
  S.rev[id]={l:l,due:Date.now()+GAPS[l]*DAY};
}
function isDue(id){var r=S.rev[id];return !r||r.due<=Date.now();}
function dueItems(){return badItems().filter(function(it){return isDue(it.id);});}
function nextDueText(){
  var t=Infinity;badItems().forEach(function(it){var r=S.rev[it.id];if(r&&r.due<t)t=r.due;});
  if(t===Infinity)return "";
  /* say the real time: "today at 22:46", "tomorrow at 21:14", or the date */
  var due=new Date(t),now=new Date(),hm=("0"+due.getHours()).slice(-2)+":"+("0"+due.getMinutes()).slice(-2);
  var d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  var dd=Math.round((new Date(due.getFullYear(),due.getMonth(),due.getDate()).getTime()-d0)/DAY);
  if(dd<=0)return "היום ב-"+hm;
  if(dd===1)return "מחר ב-"+hm;
  return "בעוד "+dd+" ימים ("+due.getDate()+"/"+(due.getMonth()+1)+")";
}

/* ---------- where I stand: first-try accuracy per section ---------- */
function stats(){
  var out=[],est=0;
  SECTIONS.forEach(function(sec){
    var tot=0,seen=0,ok=0;
    LESSONS.forEach(function(L){if(L.sec!==sec.key)return;L.items.forEach(function(it){tot++;if(it.id in S.last){seen++;if(S.last[it.id])ok++;}});});
    var acc=seen?ok/seen:0, cov=tot?seen/tot:0;
    var w=parseFloat(sec.w)/100;
    est+=w*acc*cov;
    out.push({sec:sec,acc:acc,cov:cov,seen:seen,tot:tot,w:w});
  });
  return {rows:out,est:est};
}
function recommend(st){
  var best=null;
  st.rows.forEach(function(r){var gap=r.w*(1-r.acc*r.cov);if(!best||gap>best.gap)best={r:r,gap:gap};});
  if(!best)return null;
  var ls=LESSONS.filter(function(L){return L.sec===best.r.sec.key;});
  for(var i=0;i<ls.length;i++)if(doneCount(ls[i])<ls[i].items.length)return ls[i];
  return ls[0];
}

  var now=Date.now(),t=+(btn.dataset.armed||0);

  if(!t||now-t>=8000){btn.dataset.armed=String(now);btn.textContent=armedText;}

/* ---------- progress transfer: a text code, merged on the other side ---------- */
var CODE_PREFIX="PCAP1:";
function encodeState(){
  var bytes=new TextEncoder().encode(JSON.stringify(S)),bin="";
  for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return CODE_PREFIX+btoa(bin);
}
/* tolerant: the prefix may be missing (a long-press on a phone selects only the part after ":"),
   and spaces, line breaks, invisible characters or quotes may sneak in */
function decodeState(text){
  /* the box may hold more than one paste: try the newest piece first, then the rest */
  var raw=String(text||""),pieces=raw.split(/PCAP1:/i),tries=[];
  for(var i=pieces.length-1;i>=0;i--)tries.push(pieces[i]);
  /* every code starts with the same letters (base64 of {"done"), so a code glued to a leftover can still be found */
  var flat=raw.replace(/\s+/g,""),marks=[],at=flat.indexOf("eyJkb25l");
  while(at>=0){marks.push(at);at=flat.indexOf("eyJkb25l",at+1);}
  for(var m=marks.length-1;m>=0;m--)tries.push(flat.slice(marks[m],m+1<marks.length?marks[m+1]:flat.length));
  tries.push(raw);
  for(var j=0;j<tries.length;j++){try{return decodeOne(tries[j]);}catch(e){}}
  throw new Error("invalid");
}
function decodeOne(code){
  code=String(code||"").replace(/[\s\u200B-\u200F\u2028-\u202F\u2060\uFEFF"'`\u201C\u201D\u2018\u2019]/g,"");
  var at=code.toUpperCase().lastIndexOf("PCAP1:");
  if(at>=0)code=code.slice(at+6);
  code=code.replace(/-/g,"+").replace(/_/g,"/").replace(/=+$/,"");
  if(!/^[A-Za-z0-9+\/]+$/.test(code))throw new Error("chars");
  while(code.length%4)code+="=";
  var bin=atob(code),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  var obj=JSON.parse(new TextDecoder().decode(bytes));
  if(!isObj(obj)||!isObj(obj.done))throw new Error("shape");
  return normalize(obj);
}

    /* pasting a code is a deliberate restore: it is not discarded by an earlier reset */
    if(S.reset){
      ["done","bad","rev","last","mast","at"].forEach(function(f){for(var k in got[f])if((got.at[k]||0)<=S.reset)got.at[k]=now;});
      got.exams.forEach(function(r,i){if(r.ts<=S.reset)r.ts=S.reset+1+i;});
      for(var k2 in got.seen)if(got.seen[k2]<=S.reset)got.seen[k2]=now;
    }
    got.reset=0;
    S=mergeState(S,got);save();
    imsg.innerHTML="";imsg.appendChild(el("div","fb ok","<b>מוזג!</b>שאלות שנוספו: "+Math.max(0,totalDone()-before)+". עכשיו יש "+totalDone()+" מתוך "+TOTAL+"."));
    inp.value="";out.value=code=encodeState();
  };
  b.appendChild(inp);
  if(navigator.clipboard&&typeof navigator.clipboard.readText==="function"){
    var pb=txt("button","btn alt","הדבקה מהלוח");
    pb.onclick=function(){try{navigator.clipboard.readText().then(function(t){inp.value=t;},function(){pb.hidden=true;inp.focus();});}catch(e){pb.hidden=true;inp.focus();}};
    b.appendChild(pb);
  }
  b.appendChild(ib);b.appendChild(imsg);
  app.appendChild(b);
}

/* ---------- lesson, review and daily ---------- */
var seq=null,pos=0,mode="lesson",lessonIdx=0,ATT={};
function openLesson(i,j,skipIntro){mode="lesson";lessonIdx=i;seq=LESSONS[i].items;pos=j||0;
  try{localStorage.setItem(KEY+"-cur",LESSONS[i].id);}catch(e){}
  if(!skipIntro&&LESSONS[i].intro&&LESSONS[i].intro.length)showIntro();else step();}
function openReview(){mode="review";seq=shuffle(dueItems());pos=0;if(!seq.length){home();return;}step();}
/* a question answered right on the first try MASTER times in a row is "mastered" and leaves the daily set */
var MASTER=5, RECENT=12*3600000;
function isMastered(id){return (S.mast[id]||0)>=MASTER&&!S.bad[id];}
function masteredCount(){var c=0;for(var k in ITEMS)if(isMastered(k))c++;return c;}
function openDaily(){
  var now=Date.now(),pick=[],taken={};
  function add(list,n){for(var i=0;i<list.length&&n>0&&pick.length<5;i++){var it=list[i];if(!taken[it.id]){taken[it.id]=1;pick.push(it);n--;}}}
  function notRecent(it){return now-(S.seen[it.id]||0)>=RECENT;}
  /* 1. mistakes whose review is due today */
  add(shuffle(dueItems()),2);
  /* 2. one more question you got wrong in a lesson, even if its review day has not come yet */
  add(shuffle(badItems().filter(notRecent)),1);
  /* 3. questions you studied and have not mastered yet, the least practiced first */
  var studied=[];
  LESSONS.forEach(function(L){L.items.forEach(function(it){if(isDone(it.id)&&!isMastered(it.id)&&notRecent(it))studied.push(it);});});
  studied=shuffle(studied).sort(function(a,b){return (S.mast[a.id]||0)-(S.mast[b.id]||0);});
  add(studied,4-pick.length);
  /* 4. at least one new question, from the next lessons in order */
  var fresh=[];LESSONS.forEach(function(L){L.items.forEach(function(it){if(!isDone(it.id)&&!S.pv[it.id])fresh.push(it);});});
  fresh=fresh.concat(Object.keys(S.pv).map(function(k){return ITEMS[k];}).filter(function(it){return it&&!isDone(it.id);}));
  add(fresh,Math.max(1,5-pick.length));
  /* 5. still short: anything not seen lately, then anything at all */
  add(shuffle(Object.keys(ITEMS).map(function(k){return ITEMS[k];}).filter(notRecent)),5);
  add(shuffle(Object.keys(ITEMS).map(function(k){return ITEMS[k];})),5);
  mode="daily";seq=shuffle(pick);pos=0;step();
}
function showIntro(){
  view="intro";app.innerHTML="";window.scrollTo(0,0);
  var L=LESSONS[lessonIdx];
  var top=el("div","topline");
  var back=txt("button","back","חזרה");back.onclick=home;top.appendChild(back);
  top.appendChild(el("div","dots"));
  top.appendChild(txt("span","muted","הסבר"));
  app.appendChild(top);
  var head=el("div","card");
  head.appendChild(txt("h1","","שיעור "+L.n+": "+L.t));
  head.appendChild(txt("p","muted","קודם קוראים את ההסבר, ואחריו "+L.items.length+" שאלות קצרות. הנושא שווה "+L.w+" מהמבחן."));
  app.appendChild(head);
  L.intro.forEach(function(sct,k){
    var c=el("div","card sec");
    c.appendChild(txt("h2","",(k+1)+". "+sct.h));
    c.appendChild(el("div","t",sct.t));
    if(sct.code){var pre=el("pre","code");pre.textContent=sct.code;c.appendChild(pre);}
    if(sct.out){c.appendChild(txt("div","outl","פלט:"));var o=el("div","out");o.textContent=sct.out;c.appendChild(o);}
    app.appendChild(c);
  });
  var acts=el("div","actions");
  var go=txt("button","btn",pos>0?"הבא: לשאלה "+(pos+1):"הבא: לשאלות");go.onclick=step;acts.appendChild(go);
  app.appendChild(acts);
}

function step(){
  view="step";app.innerHTML="";window.scrollTo(0,0);
  var it=seq[pos],K=kOf(it),right=correctSet(it);
  var top=el("div","topline");
  var back=txt("button","back","חזרה");back.onclick=home;top.appendChild(back);
  var srcIdx=seq[pos].lesson;
  if((LESSONS[srcIdx].intro||[]).length){var ib=txt("button","back alt","הסבר");ib.onclick=function(){lessonIdx=srcIdx;showIntro();};top.appendChild(ib);}
  var dots=el("div","dots");dots.setAttribute("aria-hidden","true");
  seq.forEach(function(x,k){dots.appendChild(el("i",(isDone(x.id)&&mode==="lesson"?"d ":"")+(k===pos?"c":"")));});
  top.appendChild(dots);
  var lbl=mode==="review"?"טעויות ":mode==="daily"?"היום ":"שאלה ";
  top.appendChild(txt("span","muted",lbl+(pos+1)+"/"+seq.length));
  app.appendChild(top);
  var src=LESSONS[it.lesson];
  app.appendChild(txt("div","muted","שיעור "+src.n+": "+src.t));

  var card=el("div","card");
  if(it.c)card.appendChild(el("div","concept","<b>לזכור:</b> "+it.c));
  if(it.code){var pre=el("pre","code");pre.textContent=it.code;card.appendChild(pre);}
  var qd=el("div","q");qd.appendChild(txt("span","",it.q.replace(" (בחר שתיים)","")));var ch=pickChip(it);if(ch)qd.appendChild(ch);card.appendChild(qd);
  var opts=el("div","opts");card.appendChild(opts);
  var hintHost=el("div");hintHost.setAttribute("aria-live","polite");card.appendChild(hintHost);
  var fb=el("div");fb.setAttribute("aria-live","polite");card.appendChild(fb);
  var actions=el("div","actions");card.appendChild(actions);
  app.appendChild(card);

  /* the attempt survives leaving the question (explanation, back): a wrong answer still counts after you return */
  var att=ATT[it.id]||(ATT[it.id]={wrong:false,hints:0});
  var hints=0,wrongOnce=att.wrong,solved=false,chosen=[];screenAt=Date.now();
  var hb=txt("button","btn alt","רמז");
  function showHint(){
    hintHost.appendChild(el("div","hintbox","<b>רמז "+(hints+1)+":</b> "+it.h[hints]));
    hints++;att.hints=Math.max(att.hints,hints);
    hb.textContent=hints>=it.h.length?"אין עוד רמזים":"רמז נוסף";
    if(hints>=it.h.length)hb.disabled=true;
  }
  hb.onclick=function(){if(!tooSoon()&&hints<it.h.length)showHint();};
  while(hints<att.hints&&hints<it.h.length)showHint();
  var checkBtn=null;
  if(K>1){checkBtn=txt("button","btn","בדיקה");checkBtn.disabled=true;actions.appendChild(checkBtn);}
  actions.appendChild(hb);

  function win(){
    solved=true;
    Array.prototype.forEach.call(opts.children,function(x){x.disabled=true;if(right.indexOf(x.textContent)>=0)x.className="opt ok";});
    S.last[it.id]=wrongOnce?0:1;
    S.seen[it.id]=Date.now();
    if(wrongOnce)delete S.mast[it.id];else S.mast[it.id]=(S.mast[it.id]||0)+1;
    if(!wrongOnce)markRight(it.id);
    /* a new question met in "10 minutes today" stays a preview until you study its lesson */
    var preview=mode==="daily"&&!isDone(it.id)&&doneCount(LESSONS[it.lesson])===0;
    if(preview)S.pv[it.id]=1;else delete S.pv[it.id];
    S.done[it.id]=true;touch(it.id);delete ATT[it.id];save();
    fb.innerHTML="";fb.appendChild(el("div","fb ok","<b>נכון!</b>"+it.e));
    if(!wrongOnce&&S.mast[it.id]===MASTER&&!S.bad[it.id])fb.appendChild(el("div","fb ok","<b>שלטת בשאלה הזו!</b>ענית עליה נכון 5 פעמים ברצף, אז היא כבר לא תחזור ב-10 הדקות."));
    hb.hidden=true;if(checkBtn)checkBtn.hidden=true;
    var last=pos>=seq.length-1;
    var nx=txt("button","btn",last?(mode==="lesson"?"סיום שיעור":"סיום"):"הבא");
    nx.onclick=function(){if(last){finish();}else{pos++;step();}};
    actions.appendChild(nx);nx.focus();
  }
  function miss(msg){
    wrongOnce=true;att.wrong=true;markWrong(it.id);S.last[it.id]=0;delete S.mast[it.id];touch(it.id);save();
    fb.innerHTML="";fb.appendChild(el("div","fb no","<b>עוד לא.</b>"+msg));
  }
  if(checkBtn)checkBtn.onclick=function(){
    if(solved||chosen.length!==K)return;
    if(sameSet(chosen,right)){win();return;}
    var good=chosen.filter(function(c){return right.indexOf(c)>=0;}).length;
    Array.prototype.forEach.call(opts.children,function(x){if(chosen.indexOf(x.textContent)>=0&&right.indexOf(x.textContent)<0){x.className="opt no";x.disabled=true;}else if(!x.disabled)x.className="opt";});
    chosen=chosen.filter(function(c){return right.indexOf(c)>=0;});
    Array.prototype.forEach.call(opts.children,function(x){if(chosen.indexOf(x.textContent)>=0)x.className="opt sel";});
    checkBtn.disabled=chosen.length!==K;syncPressed(opts);
    miss(" בחרת "+good+" נכונות מתוך "+K+". מה שסומן באדום לא נכון. בחר אחרת, או לחץ על רמז.");
  };
  shuffle(it.o).forEach(function(o){
    var b=txt("button","opt",o);setDir(b,o);
    b.onclick=function(){
      if(solved||tooSoon())return;
      if(K>1){
        var ix=chosen.indexOf(o);
        if(ix>=0){chosen.splice(ix,1);b.className="opt";}
        else if(chosen.length<K){chosen.push(o);b.className="opt sel";}
        syncPressed(opts);
        checkBtn.disabled=chosen.length!==K;
        return;
      }
      if(o===right[0]){b.className="opt ok";win();}
      else{b.className="opt no";b.disabled=true;miss("נסה שוב, או לחץ על רמז.");}
    };
    opts.appendChild(b);
  });
  if(K>1)syncPressed(opts);
}

function finish(){
  view="done";app.innerHTML="";window.scrollTo(0,0);
  var c=el("div","card center");
  if(mode==="lesson"){
    var L=LESSONS[lessonIdx];
    c.appendChild(txt("div","big",doneCount(L)+"/"+L.items.length));
    c.appendChild(txt("h2","","סיימת: "+L.t));
  }else if(mode==="daily"){
    c.appendChild(txt("h2","","סיימת את 10 הדקות של היום"));
  }else{
    var left=dueItems().length,all=badItems().length;
    c.appendChild(txt("h2","",left?"נשארו "+left+" טעויות לחזרה היום":"סיימת את החזרה של היום"));
    if(all)c.appendChild(txt("p","muted","כל טעות חוזרת אחרי יום, 3 ימים ושבוע, עד שהיא נתפסת. "+all+" בתהליך."));
  }
  c.appendChild(txt("p","muted","סה\"כ הושלמו "+totalDone()+" מתוך "+TOTAL+" שאלות."));
  app.appendChild(c);
  var acts=el("div","actions");
  if(mode==="lesson"&&lessonIdx<LESSONS.length-1){
    var nb=txt("button","btn","לשיעור הבא");nb.onclick=function(){openLesson(lessonIdx+1,0);};acts.appendChild(nb);
  }
  if(mode==="lesson"&&PDFS[LESSONS[lessonIdx].id])acts.appendChild(pdfControl(LESSONS[lessonIdx],"שמירת PDF של השיעור"));
  var hb=txt("button","btn alt","לרשימת השיעורים");hb.onclick=home;acts.appendChild(hb);
  app.appendChild(acts);
}

/* ---------- PDF save: through the viewer's save dialog (plain links are blocked in the app) ---------- */
var dlNs=null,dlTried=false;
try{if(window.claude&&typeof claude.use==="function"){claude.use("downloads").then(function(d){dlNs=d;dlTried=true;}).catch(function(){dlTried=true;});}else{dlTried=true;}}catch(e){dlTried=true;}
function flash(btn,t,ms){var o=btn.getAttribute("data-l")||btn.textContent;btn.setAttribute("data-l",o);btn.textContent=t;
  clearTimeout(btn._t);btn._t=setTimeout(function(){btn.textContent=btn.getAttribute("data-l");btn.disabled=false;},ms||2500);}
/* in the app: a button that opens the save dialog; on a plain website: a normal link to the file */
function pdfControl(L,label){
  var a;
  if(STANDALONE){a=txt("a","pdf",label);a.href=PDFS[L.id];a.target="_blank";a.rel="noopener";}
  else{a=txt("button","pdf",label);a.onclick=function(){savePdf(L,a);};}
  a.setAttribute("aria-label","PDF של שיעור "+L.n);
  return a;
}
function savePdf(L,btn){
  if(btn.disabled)return;
  if(!dlNs){flash(btn,dlTried?"שמירה לא זמינה כאן":"רגע, נסה שוב",3500);return;}
  btn.disabled=true;btn.setAttribute("data-l",btn.getAttribute("data-l")||btn.textContent);btn.textContent="מכין...";
  fetch(PDFS[L.id]).then(function(r){if(!r.ok)throw new Error("http");return r.blob();})
  .then(function(b){return dlNs.save({filename:"PCAP-lesson-"+("0"+L.n).slice(-2)+".pdf",data:b});})
  .then(function(){flash(btn,"נשמר");})
  .catch(function(e){var c=e&&e.code;flash(btn,c==="declined"?"בוטל":c==="rate_limited"?"רגע, נסה שוב":"לא הצליח, נסה שוב",3500);});
}

/* ---------- mock exam: question count per section as in the real exam ---------- */
var examState=null,examTimer=null,EXKEY=KEY+"-exam";
function saveExam(){
  try{if(!examState){localStorage.removeItem(EXKEY);return;}
    localStorage.setItem(EXKEY,JSON.stringify({end:examState.end,i:examState.i,qs:examState.qs.map(function(q){return {id:q.it.id,sec:q.sec,opts:q.opts,pick:q.pick};})}));}catch(e){}
}
function loadExam(){
  try{var x=JSON.parse(localStorage.getItem(EXKEY)||"null");if(!x||!Array.isArray(x.qs)||typeof x.end!=="number")return null;
    var qs=[];for(var i=0;i<x.qs.length;i++){var q=x.qs[i],it=q&&ITEMS[q.id];if(!it||!Array.isArray(q.opts)||!Array.isArray(q.pick))return null;
      qs.push({it:it,sec:q.sec,opts:q.opts.filter(function(o){return it.o.indexOf(o)>=0;}),pick:q.pick.filter(function(o){return it.o.indexOf(o)>=0;})});}
    if(!qs.length)return null;
    return {qs:qs,i:Math.min(Math.max(0,x.i|0),qs.length-1),end:x.end};}catch(e){return null;}
}
function resumeExam(){
  var E=loadExam();if(!E){saveExam();home();return;}
  examState=E;clearInterval(examTimer);
  if(Date.now()>=E.end){examDone(true);return;}
  examTimer=setInterval(tick,1000);examStep();
}
function startExam(){
  var qs=[];
  SECTIONS.forEach(function(sec){
    var pool=[];LESSONS.forEach(function(L){if(L.sec===sec.key)L.items.forEach(function(it){pool.push(it);});});
    shuffle(pool).slice(0,sec.exam).forEach(function(it){qs.push({it:it,sec:sec.key,opts:shuffle(it.o),pick:[]});});
  });
  examState={qs:shuffle(qs),i:0,end:Date.now()+65*60*1000};saveExam();
  clearInterval(examTimer);
  examTimer=setInterval(tick,1000);
  examStep();
}
function tick(){
  var t=document.getElementById("clock");if(!t||!examState)return;
  var left=Math.max(0,Math.round((examState.end-Date.now())/1000));
  t.textContent=Math.floor(left/60)+":"+("0"+(left%60)).slice(-2);
  if(left<=0)examDone(true);
}
function examStep(){
  view="exam";app.innerHTML="";window.scrollTo(0,0);
  var E=examState,q=E.qs[E.i],K=kOf(q.it);
  var top=el("div","topline");
  var quit=txt("button","back","יציאה");quit.onclick=function(){confirmTap(quit,"בטוח? לחץ שוב",function(){examState=null;saveExam();home();});};
  top.appendChild(quit);
  top.appendChild(el("div","dots"));
  var clk=txt("span","big","");clk.id="clock";clk.style.fontSize="1.3rem";top.appendChild(clk);
  app.appendChild(top);
  screenAt=Date.now();
  var slash=q.opts.some(function(o){return o.indexOf(" / ")>=0;});
  app.appendChild(txt("div","muted","שאלה "+(E.i+1)+" מתוך "+E.qs.length+(slash?" · / = ירידת שורה":"")));
  var card=el("div","card");
  if(q.it.code){var pre=el("pre","code");pre.textContent=q.it.code;card.appendChild(pre);}
  var qd=el("div","q");qd.appendChild(txt("span","",q.it.q.replace(" (בחר שתיים)","")));var ch=pickChip(q.it);if(ch)qd.appendChild(ch);card.appendChild(qd);
  var opts=el("div","opts");card.appendChild(opts);
  var actions=el("div","actions");card.appendChild(actions);
  app.appendChild(card);
  var nx=txt("button","btn",E.i>=E.qs.length-1?"סיום מבחן":"הבא");
  nx.disabled=q.pick.length!==K;
  nx.onclick=function(){if(tooSoon())return;if(E.i>=E.qs.length-1)examDone();else{E.i++;saveExam();examStep();}};
  q.opts.forEach(function(o){
    var b=txt("button","opt"+(q.pick.indexOf(o)>=0?" sel":""),o);setDir(b,o);
    b.onclick=function(){
      if(tooSoon())return;
      if(K===1){q.pick=[o];Array.prototype.forEach.call(opts.children,function(x){x.className="opt";});b.className="opt sel";}
      else{var ix=q.pick.indexOf(o);if(ix>=0){q.pick.splice(ix,1);b.className="opt";}else if(q.pick.length<K){q.pick.push(o);b.className="opt sel";}}
      syncPressed(opts);saveExam();
      nx.disabled=q.pick.length!==K;
    };
    opts.appendChild(b);
  });
  actions.appendChild(nx);syncPressed(opts);
  if(E.i>0){var pv=txt("button","btn ghost","שאלה קודמת");pv.onclick=function(){if(tooSoon())return;E.i--;saveExam();examStep();};actions.appendChild(pv);}
  tick();
}
function examDone(timeUp){
  clearInterval(examTimer);
  var E=examState;if(!E)return;examState=null;saveExam();view="result";
  app.innerHTML="";window.scrollTo(0,0);
  var score=0,by={},wrong=[],skipped=0;
  E.qs.forEach(function(q){
    var ok=sameSet(q.pick,correctSet(q.it));
    by[q.sec]=by[q.sec]||{ok:0,n:0};by[q.sec].n++;
    if(!q.pick.length){skipped++;wrong.push(q);return;}
    S.last[q.it.id]=ok?1:0;S.seen[q.it.id]=Date.now();touch(q.it.id);
    if(ok)S.mast[q.it.id]=(S.mast[q.it.id]||0)+1;else delete S.mast[q.it.id];
    if(ok){score++;by[q.sec].ok++;markRight(q.it.id);}else{wrong.push(q);markWrong(q.it.id);}
  });
  var n=E.qs.length,pass=score>=Math.ceil(n*0.72);
  var d=new Date();S.exams.push({d:d.getDate()+"/"+(d.getMonth()+1),s:score,n:n,ts:d.getTime()});if(S.exams.length>50)S.exams=S.exams.slice(-50);save();
  var c=el("div","card center");
  c.appendChild(txt("div","big",score+"/"+n));
  c.appendChild(txt("h2","",(pass?"עברת":"לא עברת")+" · "+Math.round(score/n*100)+"% (הרף 72%)"));
  if(timeUp)c.appendChild(el("div","fb no","<b>הזמן נגמר.</b>המבחן הסתיים אחרי 65 דקות, כמו במבחן האמיתי."));
  if(skipped)c.appendChild(txt("p","muted","לא ענית על "+skipped+" שאלות. הן נספרות כטעות בציון, אבל לא נוספו לחזרה על טעויות."));
  c.appendChild(txt("p","muted","התשובות השגויות נוספו לחזרה על טעויות."));
  app.appendChild(c);
  var br=el("div","card");br.appendChild(txt("h2","","לפי נושא"));
  SECTIONS.forEach(function(sec){var b=by[sec.key];if(!b)return;
    var row=el("div","brow");row.appendChild(txt("span","",sec.name));
    row.appendChild(txt("span","pill"+(b.ok/b.n>=0.72?" done":""),b.ok+"/"+b.n));br.appendChild(row);});
  app.appendChild(br);
  wrong.forEach(function(q){
    var w=el("div","card");
    if(q.it.code){var pre=el("pre","code");pre.textContent=q.it.code;w.appendChild(pre);}
    w.appendChild(txt("div","q",q.it.q));
    var yo=el("div","fb no","<b>ענית:</b>");var ys=txt("span","",q.pick.length?q.pick.join(" | "):"לא ענית");setDir(ys,ys.textContent);yo.appendChild(ys);w.appendChild(yo);
    var co=el("div","fb ok","<b>התשובה הנכונה:</b>");var cs=txt("span","",correctSet(q.it).join(" | "));setDir(cs,cs.textContent);co.appendChild(cs);co.appendChild(el("div","",q.it.e));w.appendChild(co);
    app.appendChild(w);
  });
  var acts=el("div","actions");
  var hb=txt("button","btn","לרשימת השיעורים");hb.onclick=home;acts.appendChild(hb);
  app.appendChild(acts);
}
home();
</script>
