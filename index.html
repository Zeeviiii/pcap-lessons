<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>שיעורי PCAP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow column, one step on screen at a time. Home = lesson list; lesson = concept, code, question, hints. */
:root{
  --bg:#eef3f4; --card:#ffffff; --line:#d3dfe2; --ink:#16282d; --muted:#53696f;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#dff3f0;
  --code-bg:#12262b; --code-ink:#dcf3ef; --inline-bg:#e3eeef; --inline-ink:#0b4a45;
  --opt:#f6fafa; --ok:#16a34a; --ok-bg:#e8f7ee; --ok-ink:#14532d;
  --bad:#dc2626; --bad-bg:#fdecec; --bad-ink:#7f1d1d;
  --hint:#b45309; --hint-bg:#fff4e0;
  --sans:'Heebo',-apple-system,BlinkMacSystemFont,'Arial Hebrew',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1a1d; --card:#142a2e; --line:#244047; --ink:#e4f1f2; --muted:#9ab5b9;
  --accent:#2dd4bf; --accent-ink:#06302c; --accent-soft:#17383a;
  --code-bg:#0a1517; --code-ink:#d3efea; --inline-bg:#1c3a3e; --inline-ink:#b8ece4;
  --opt:#183238; --ok:#22c55e; --ok-bg:#123422; --ok-ink:#c9ffd9;
  --bad:#f87171; --bad-bg:#3a1717; --bad-ink:#ffd7d7;
  --hint:#fbbf24; --hint-bg:#3a2a12; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1a1d; --card:#142a2e; --line:#244047; --ink:#e4f1f2; --muted:#9ab5b9;
  --accent:#2dd4bf; --accent-ink:#06302c; --accent-soft:#17383a;
  --code-bg:#0a1517; --code-ink:#d3efea; --inline-bg:#1c3a3e; --inline-ink:#b8ece4;
  --opt:#183238; --ok:#22c55e; --ok-bg:#123422; --ok-ink:#c9ffd9;
  --bad:#f87171; --bad-bg:#3a1717; --bad-ink:#ffd7d7;
  --hint:#fbbf24; --hint-bg:#3a2a12; color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);direction:rtl;background:var(--bg);color:var(--ink);
  font-size:clamp(17px,2.4vw,20px);line-height:1.6;
  padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:clamp(1.6rem,4vw,2rem);font-weight:900;color:var(--accent);line-height:1.2;text-wrap:balance}
h2{font-size:1.15em;font-weight:700}
.muted{color:var(--muted);font-size:.92em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,2.4vw,22px)}
code{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);background:var(--inline-bg);color:var(--inline-ink);padding:1px 6px;border-radius:5px;font-size:.88em}
pre.code{direction:ltr;text-align:left;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);
  font-size:clamp(.92rem,2vw,1.05rem);line-height:1.55;padding:14px 16px;border-radius:10px;margin:12px 0;overflow-x:auto;white-space:pre;font-variant-ligatures:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.02em;padding:12px 18px}
.btn.alt{background:var(--accent-soft);color:var(--ink);border:2px solid var(--accent)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);min-height:44px;font-weight:500;font-size:.92em}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 200px;min-width:0}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:64px}
.lesson:hover{border-color:var(--accent)}
.lesson .t{flex:1;min-width:0;font-weight:700}
.lesson .s{font-size:.85em;color:var(--muted);font-weight:400}
.pill{font-size:.8em;font-weight:700;border-radius:12px;padding:2px 10px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.pill.done{background:var(--ok-bg);color:var(--ok-ink)}
.topline{display:flex;align-items:center;gap:10px}
.topline .back{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:44px;padding:0 14px}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.d{background:var(--ok)} .dots i.c{outline:3px solid var(--accent);outline-offset:1px}
.concept{background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-bottom:6px}
.concept b{color:var(--accent)}
.q{font-weight:700;font-size:1.12em;margin-top:10px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{width:100%;text-align:start;min-height:56px;padding:12px 16px;background:var(--opt);border:2px solid var(--line);border-radius:12px;font-size:1.02em;unicode-bidi:plaintext;font-variant-ligatures:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-ink);font-weight:700}
.opt.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-ink);opacity:.8}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.pdf{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--accent);font-weight:700;font-size:.9em;text-decoration:none;padding:6px 14px}
.pdf:hover{border-color:var(--accent)}
.pdf:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lrow{display:flex;gap:8px;align-items:stretch}
.lrow .lesson{flex:1;min-width:0}
.lrow .pdf{flex:0 0 auto}
.hintbox{background:var(--hint-bg);border-right:5px solid var(--hint);border-radius:10px;padding:10px 14px;margin-top:10px}
.fb{border-radius:12px;padding:12px 16px;margin-top:12px}
.fb.ok{background:var(--ok-bg);color:var(--ok-ink);border-right:5px solid var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad-ink);border-right:5px solid var(--bad)}
.fb>b:first-child{display:block;margin-bottom:2px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.big{font-size:2.4rem;font-weight:900;color:var(--accent);direction:ltr;unicode-bidi:isolate}
.center{text-align:center}
.sec h2{color:var(--accent);margin-bottom:6px}
.sec .t{line-height:1.75}
.out{direction:ltr;text-align:left;background:var(--opt);border:1px dashed var(--line);border-radius:10px;font-family:var(--mono);font-size:clamp(.9rem,2vw,1rem);padding:10px 14px;white-space:pre-wrap;word-break:break-word;margin-top:-4px}
.outl{font-size:.85em;color:var(--muted);font-weight:700;margin-top:6px}
.topline .back.alt{color:var(--accent);font-weight:700}
.chip{display:inline-block;margin-inline-start:8px;font-size:.78em;font-weight:700;border-radius:10px;padding:2px 10px;background:var(--hint-bg);color:var(--hint);border:1px solid var(--hint);vertical-align:middle}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;padding:0 4px}
.sechead h2{color:var(--accent)}
.brow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.codebox{display:block;width:100%;min-height:90px;margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--opt);color:var(--ink);font-family:var(--mono);font-size:.8em;direction:ltr;text-align:left;word-break:break-all;resize:vertical}
.codebox:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>

<script>
/* ---------- data (generated by build_site.py from lessons_data.py) ---------- */
var DATA={"sections": [{"key": "modules", "name": "מודולים וחבילות", "w": "12%", "exam": 5}, {"key": "exceptions", "name": "חריגות (Exceptions)", "w": "12%", "exam": 5}, {"key": "strings", "name": "מחרוזות", "w": "9.5%", "exam": 4}, {"key": "oop", "name": "תכנות מונחה עצמים (OOP)", "w": "28.5%", "exam": 12}, {"key": "advanced", "name": "מתקדם וקבצים", "w": "24%", "exam": 10}, {"key": "testing", "name": "בדיקות, צוות ו-AI", "w": "14%", "exam": 6}], "lessons": [{"t": "מודולים: צורות import", "w": "12%", "items": [{"c": "<code>from math import sqrt<\/code> מביא את השם ישר, בלי קידומת <code>math.<\/code>", "code": "from math import sqrt\nprint(sqrt(16))", "q": "מה יודפס?", "o": ["4.0", "4", "NameError", "16"], "h": ["sqrt מחזיר int או float?", "שורש ב-Python תמיד מחזיר float."], "e": "<code>sqrt<\/code> מחזירה float, לכן <code>4.0<\/code> ולא <code>4<\/code>.", "id": "3-0"}, {"c": "<code>import math as m<\/code> נותן שם חדש. השם <code>math<\/code> עצמו כבר לא קיים.", "code": "import math as m\nprint(math.sqrt(4))", "q": "מה יקרה?", "o": ["NameError", "יודפס 2.0", "יודפס 2", "ImportError"], "h": ["איזה שם יצרנו ב-import?", "רק m קיים. math לא הוגדר."], "e": "אחרי <code>as m<\/code> קיים רק <code>m<\/code>. השם <code>math<\/code> לא מוגדר, לכן <code>NameError<\/code>.", "id": "3-1"}, {"c": "<code>from module import *<\/code> מביא את כל השמות <b>שלא מתחילים בקו תחתון<\/b>. אם ב-module יש <code>__all__<\/code>, מובאים רק השמות שברשימה שלו.", "code": "# module.py\n__all__ = [\"a\"]\na = 1\nb = 2\n\n# main.py\nfrom module import *\nprint(a)\nprint(b)", "q": "מה קורה?", "o": ["מודפס 1 ואז NameError", "מודפס 1 ואז 2", "NameError לפני כל הדפסה", "מודפס 2 ואז 1"], "h": ["מה כתוב ב-__all__?", "b לא ברשימה, אז לא הובא ל-main."], "e": "רק <code>a<\/code> ב-<code>__all__<\/code>, אז <code>print(a)<\/code> מדפיס 1, ו-<code>print(b)<\/code> זורק <code>NameError<\/code>.", "id": "3-2"}, {"id": "x-mod1-k", "q": "אחרי from math import sqrt, אילו שתי שורות יעבדו? (בחר שתיים)", "o": ["print(sqrt(4))", "print(sqrt(9) + 1)", "print(math.sqrt(4))", "print(math.pi)", "print(pi)"], "h": ["איזה שם בדיוק נוצר ב-import הזה?", "רק sqrt קיים. math ו-pi לא."], "e": "רק השם <code>sqrt<\/code> הובא. <code>math<\/code> לא מוגדר, וגם <code>pi<\/code> לא יובא.", "k": 2}], "intro": [{"h": "מה זה מודול?", "t": "מודול הוא פשוט קובץ <code>.py<\/code>. <code>import<\/code> מריץ אותו <b>פעם אחת<\/b> ונותן גישה לשמות שבו. <b>גשר:<\/b> דומה ל-<code>#include<\/code> ב-C, אבל השמות נשארים בתוך שם המודול."}, {"h": "ארבע צורות של import", "t": "שימו לב איך קוראים לפונקציה בכל צורה.", "code": "import math\nprint(math.sqrt(9))\n\nfrom math import sqrt\nprint(sqrt(9))\n\nimport math as m\nprint(m.sqrt(9))\n\nfrom math import sqrt as s\nprint(s(9))", "out": "3.0\n3.0\n3.0\n3.0"}, {"h": "מלכודת: as מחליף את השם", "t": "אחרי <code>import math as m<\/code> קיים רק השם <code>m<\/code>. כתיבת <code>math.sqrt<\/code> תיתן <code>NameError<\/code>."}, {"h": "import * והקו התחתון", "t": "<code>from module import *<\/code> מביא את כל השמות, <b>חוץ משמות שמתחילים ב-<code>_<\/code><\/b>. אם במודול מוגדרת רשימה <code>__all__<\/code>, מובאים רק השמות שבה."}, {"h": "מודול math בקצרה", "t": "פונקציות שמופיעות הרבה במבחן.", "code": "import math\nprint(math.pi)\nprint(math.ceil(2.1), math.floor(2.9))\nprint(math.factorial(4))", "out": "3.141592653589793\n3 2\n24"}], "id": "mod1", "sec": "modules"}, {"t": "מודולים: __name__, חבילות, pip", "w": "12%", "items": [{"c": "<code>__name__<\/code> הוא <code>\"__main__\"<\/code> בקובץ שהרצת ישירות, ושם המודול בקובץ שיובא. כמו בדיקת <code>main<\/code> ב-C, רק אוטומטי.", "code": "# util.py\nprint(__name__)\n\n# main.py\nimport util\nprint(__name__)", "q": "מריצים python main.py. מה יודפס?", "o": ["util / __main__", "__main__ / __main__", "util / util", "__main__ / util"], "h": ["איזה קובץ הורץ ישירות?", "import util מריץ את util.py, ושם __name__ הוא שם המודול."], "e": "בזמן ה-import <code>util.py<\/code> רץ כמודול, ו-<code>__name__<\/code> שלו הוא <code>util<\/code>. ב-<code>main.py<\/code> השם <code>__main__<\/code>.", "id": "4-0"}, {"c": "חבילה (package) היא תיקייה עם קובץ <code>__init__.py<\/code>. (מ-Python 3.3 אפשר גם בלי, אבל במבחן: <code>__init__.py<\/code> מסמן חבילה.)", "q": "מה תפקיד __init__.py בתיקיית חבילה?", "o": ["מסמן שהתיקייה היא חבילה, ורץ כשמייבאים אותה", "מריץ את כל הקבצים בתיקייה", "מוחק קבצים ישנים", "מגדיר את גרסת Python"], "h": ["חשוב על השם: init, התחלה.", "הוא רץ פעם אחת בעת ה-import של החבילה."], "e": "<code>__init__.py<\/code> מסמן חבילה, ורץ כשמייבאים אותה. אפשר להגדיר בו <code>__all__<\/code>.", "id": "4-1"}, {"c": "<code>pip freeze<\/code> מדפיס את החבילות המותקנות עם גרסאות, בפורמט שמתאים ל-requirements.", "q": "איזו פקודה כותבת את החבילות המותקנות לקובץ requirements?", "o": ["pip freeze > requirements.txt", "pip install > requirements.txt", "pip show requirements.txt", "pip uninstall -r requirements.txt"], "h": ["איזו פקודה \"מקפיאה\" רשימה של מה שמותקן?", "ה-> שולח את הפלט לקובץ."], "e": "<code>pip freeze > requirements.txt<\/code> שומר את הרשימה. ואז <code>pip install -r requirements.txt<\/code> מתקין אותה.", "id": "4-2"}, {"id": "x-mod2-k", "q": "אילו שתי פקודות מתקינות חבילה? (בחר שתיים)", "o": ["pip install requests", "python -m pip install requests", "pip list requests", "pip show requests", "pip freeze requests"], "h": ["רק פקודה אחת של pip מתקינה.", "python -m pip מריץ את אותו pip."], "e": "<code>pip install<\/code> מתקין. <code>python -m pip install<\/code> הוא אותו דבר דרך ה-Python הנוכחי.", "k": 2}], "intro": [{"h": "__name__ ו-__main__", "t": "כל מודול מקבל משתנה <code>__name__<\/code>. בקובץ שהרצת ישירות הוא <code>\"__main__\"<\/code>. בקובץ שיובא, הוא שם המודול (שם הקובץ בלי <code>.py<\/code>). כך כותבים קוד שרץ רק כשמריצים את הקובץ ישירות, כמו <code>main()<\/code> ב-C.", "code": "def greet():\n    return \"hi\"\n\nif __name__ == \"__main__\":\n    print(greet())"}, {"h": "חבילה (package)", "t": "חבילה היא תיקייה של מודולים. הקובץ <code>__init__.py<\/code> מסמן אותה כחבילה, ורץ בפעם הראשונה שמייבאים אותה.", "code": "shop/\n    __init__.py\n    cart.py\n\n# in main.py\nimport shop.cart\nfrom shop import cart"}, {"h": "איפה Python מחפש מודולים?", "t": "קודם בתיקייה של הקובץ שהרצת, ואחר כך בתיקיות שברשימה <code>sys.path<\/code>. אם המודול לא נמצא באף אחת: <code>ModuleNotFoundError<\/code>."}, {"h": "pip: התקנת חבילות", "t": "<code>pip<\/code> מתקין חבילות מ-PyPI.", "code": "pip install requests\npip uninstall requests\npip list\npip show requests\npip freeze > requirements.txt\npip install -r requirements.txt"}], "id": "mod2", "sec": "modules"}, {"id": "mod3", "t": "מודולים: dir, sys.path ושגיאות import", "intro": [{"h": "dir(): אילו שמות יש במודול", "t": "<code>dir(module)<\/code> מחזיר רשימה של כל השמות שבמודול. <code>dir()<\/code> בלי כלום מחזיר את השמות בסביבה הנוכחית.", "code": "import math\nprint(\"sqrt\" in dir(math), \"hello\" in dir(math))", "out": "True False"}, {"h": "sys.path: איפה Python מחפש", "t": "<code>sys.path<\/code> היא <b>רשימה<\/b> של תיקיות. Python מחפש מודול לפי הסדר: קודם תיקיית הסקריפט, אחר כך הספרייה הסטנדרטית והחבילות המותקנות. אפשר להוסיף תיקייה בזמן ריצה.", "code": "import sys\nsys.path.append(\"/my/libs\")\nprint(sys.path[-1])", "out": "/my/libs"}, {"h": "שגיאות import", "t": "מודול שלא קיים: <code>ModuleNotFoundError<\/code>, שהיא ילדה של <code>ImportError<\/code>. שם שלא קיים בתוך מודול קיים (<code>from math import nothing<\/code>): <code>ImportError<\/code>. גישה עם נקודה לשם חסר (<code>math.nothing<\/code>): <code>AttributeError<\/code>.", "code": "try:\n    import no_such_mod\nexcept ModuleNotFoundError as e:\n    print(type(e).__name__, issubclass(ModuleNotFoundError, ImportError))", "out": "ModuleNotFoundError True"}, {"h": "__pycache__ ו-import מעגלי", "t": "Python שומר גרסה מהודרת של מודול (bytecode, קובצי <code>.pyc<\/code>) בתיקייה <code>__pycache__<\/code> כדי לטעון מהר יותר בפעם הבאה. <b>גשר:<\/b> קצת כמו קובץ <code>.o<\/code> ב-C.<br>import מעגלי: <code>a<\/code> מייבא את <code>b<\/code>, ו-<code>b<\/code> מייבא את <code>a<\/code>. זה עלול לתת שגיאה כי שם עוד לא הוגדר. הפתרון: להעביר את הקוד המשותף למודול שלישי."}, {"h": "python -m pip", "t": "<code>python -m pip install X<\/code> מריץ את ה-pip של אותו Python בדיוק. זה שימושי כשמותקנות כמה גרסאות של Python."}], "items": [{"id": "n-mod3-1", "q": "מה מחזיר dir(math)?", "o": ["רשימה של השמות שמוגדרים במודול", "את קוד המקור של המודול", "את התיקייה שבה המודול נמצא", "את גרסת המודול"], "h": ["dir = directory של שמות.", "זה עוזר לגלות אילו פונקציות יש במודול."], "e": "<code>dir(math)<\/code> מחזיר רשימה של כל השמות במודול, כמו <code>sqrt<\/code> ו-<code>pi<\/code>.", "c": "<code>dir()<\/code> מראה אילו שמות קיימים במודול."}, {"id": "n-mod3-2", "q": "מה יקרה?", "o": ["ImportError", "ModuleNotFoundError", "NameError", "AttributeError"], "h": ["המודול math קיים. מה לא קיים?", "שם חסר בתוך from ... import נותן ImportError."], "e": "המודול נמצא, אבל השם <code>nothing<\/code> לא קיים בו. <code>from ... import<\/code> של שם חסר זורק <code>ImportError<\/code>.", "c": "שלוש שגיאות שונות: מודול חסר, שם חסר ב-from, ושם חסר אחרי נקודה.", "code": "from math import nothing"}, {"id": "n-mod3-3", "q": "מה יקרה?", "o": ["AttributeError", "ImportError", "NameError", "None"], "h": ["ה-import עצמו הצליח.", "גישה עם נקודה לשם שלא קיים באובייקט."], "e": "<code>math<\/code> יובא, אבל אין בו <code>nothing<\/code>. גישה עם נקודה לשם חסר זורקת <code>AttributeError<\/code>.", "code": "import math\nprint(math.nothing)"}, {"id": "n-mod3-4", "q": "אילו שני משפטים נכונים לגבי sys.path? (בחר שתיים)", "o": ["זו רשימה של תיקיות ש-Python מחפש בהן מודולים", "אפשר להוסיף אליה תיקייה בזמן ריצה", "זו מחרוזת אחת עם כל הנתיבים", "אי אפשר לשנות אותה מתוך הקוד", "היא מכילה רק את התיקייה הנוכחית"], "h": ["sys.path היא list.", "list אפשר לשנות, למשל עם append."], "e": "<code>sys.path<\/code> היא רשימה של תיקיות חיפוש, ואפשר לשנות אותה, למשל עם <code>append<\/code>.", "k": 2}, {"id": "n-mod3-5", "q": "מה תפקיד התיקייה __pycache__?", "o": ["שומרת bytecode מהודר כדי לטעון מודולים מהר יותר", "שומרת גיבוי של הקוד", "מכילה את החבילות שהותקנו עם pip", "שומרת קובצי לוג"], "h": ["cache = מטמון.", "הקבצים שם הם .pyc."], "e": "<code>__pycache__<\/code> שומרת קובצי <code>.pyc<\/code>, כדי שבפעם הבאה הטעינה תהיה מהירה יותר."}, {"id": "n-mod3-6", "q": "a.py מייבא את b, ו-b.py מייבא את a. איך קוראים לזה?", "o": ["import מעגלי (circular import)", "import יחסי", "import כפול", "wildcard import"], "h": ["החיצים יוצרים מעגל.", "circular = מעגלי."], "e": "שני מודולים שמייבאים זה את זה יוצרים <b>import מעגלי<\/b>. מפרקים את זה עם מודול שלישי משותף."}], "sec": "modules", "w": "12%"}, {"t": "חריגות: איך try עובד", "w": "12%", "items": [{"c": "בלוק <code>try<\/code> רץ שורה אחרי שורה. ברגע שנזרקת חריגה, קופצים ל-<code>except<\/code> המתאים, והשורות שנשארו ב-try מדולגות. ב-Java זה בדיוק try/catch. ב-C אין את זה.", "code": "try:\n    print(\"A\")\n    x = 1 / 0\n    print(\"B\")\nexcept ZeroDivisionError:\n    print(\"C\")\nprint(\"D\")", "q": "מה יודפס? (/ = ירידת שורה)", "o": ["A / C / D", "A / B / C / D", "A / D", "A / C"], "h": ["באיזו שורה בתוך try נזרקת החריגה?", "אחרי השורה שזורקת מדלגים על כל השאר ב-try. ומה רץ אחרי ה-except?"], "e": "<code>1 / 0<\/code> זורק <code>ZeroDivisionError<\/code>, ו-<code>print(\"B\")<\/code> מדולג. אחרי ה-except ממשיכים כרגיל ל-<code>D<\/code>. הפיתוי: לחשוב ש-B עדיין ירוץ.", "id": "0-0"}, {"c": "<code>else<\/code> אחרי except רץ <b>רק אם לא הייתה חריגה<\/b>. <code>finally<\/code> רץ <b>תמיד<\/b>.", "code": "try:\n    print(\"A\")\nexcept ValueError:\n    print(\"B\")\nelse:\n    print(\"C\")\nfinally:\n    print(\"D\")", "q": "מה יודפס?", "o": ["A / C / D", "A / B / D", "A / D", "A / B / C / D"], "h": ["האם נזרקה חריגה כאן?", "אין חריגה: except מדולג, else רץ, ואז finally."], "e": "אין חריגה, לכן <code>except<\/code> מדולג, <code>else<\/code> מדפיס C, ו-<code>finally<\/code> מדפיס D.", "id": "0-1"}, {"c": "<code>finally<\/code> רץ גם כשיש <code>return<\/code> בתוך ה-try. ה-return \"מחכה\" עד שה-finally מסיים.", "code": "def f():\n    try:\n        return \"T\"\n    finally:\n        print(\"F\")\n\nprint(f())", "q": "מה יודפס?", "o": ["F / T", "T", "T / F", "F"], "h": ["מי רץ קודם: ה-finally או ההדפסה מבחוץ?", "ה-finally מדפיס F לפני שהערך T חוזר ל-print."], "e": "קודם <code>finally<\/code> מדפיס F, ואז הערך <code>T<\/code> חוזר ו-<code>print<\/code> מדפיס אותו.", "id": "0-2"}, {"id": "x-exc1-k", "q": "אילו שני משפטים נכונים לגבי finally? (בחר שתיים)", "o": ["רץ גם אם נזרקה חריגה", "רץ גם אם יש return בתוך try", "רץ רק אם לא הייתה חריגה", "רץ רק אם הייתה חריגה", "לא רץ כשיש else"], "h": ["finally = תמיד.", "גם return לא עוצר אותו."], "e": "<code>finally<\/code> רץ <b>תמיד<\/b>: עם חריגה, בלי חריגה, ואפילו אחרי <code>return<\/code>.", "k": 2}], "intro": [{"h": "מה זה חריגה (Exception)?", "t": "כשמשהו משתבש בזמן ריצה, כמו חלוקה באפס או המרה לא חוקית, Python <b>זורק חריגה<\/b>. אם אף אחד לא תופס אותה, התוכנית נעצרת ומדפיסה הודעת שגיאה.", "code": "print(10 / 0)", "out": "ZeroDivisionError: division by zero"}, {"h": "try / except: לתפוס את החריגה", "t": "שמים את הקוד המסוכן בתוך <code>try<\/code>. אם נזרקת חריגה, Python קופץ <b>מיד<\/b> ל-<code>except<\/code> המתאים. השורות שנשארו ב-try לא רצות, והתוכנית ממשיכה במקום לקרוס.<br><b>גשר:<\/b> ב-Java זה בדיוק <code>try/catch<\/code>. ב-C אין מנגנון כזה, ושם בודקים ערך חזרה בעצמך.", "code": "try:\n    n = int(\"abc\")\n    print(\"never printed\")\nexcept ValueError:\n    print(\"not a number\")\nprint(\"program continues\")", "out": "not a number\nprogram continues"}, {"h": "else ו-finally", "t": "<code>else<\/code> רץ <b>רק אם לא נזרקה חריגה<\/b>.<br><code>finally<\/code> רץ <b>תמיד<\/b>: עם חריגה, בלי חריגה, ואפילו אחרי <code>return<\/code>. משתמשים בו לסגירת קבצים וחיבורים.", "code": "try:\n    x = 5 / 1\nexcept ZeroDivisionError:\n    print(\"error\")\nelse:\n    print(\"ok\", x)\nfinally:\n    print(\"done\")", "out": "ok 5.0\ndone"}, {"h": "סדר הריצה בקיצור", "t": "1. <code>try<\/code> רץ.<br>2. נזרקה חריגה? קופצים ל-<code>except<\/code> המתאים.<br>3. לא נזרקה? רץ <code>else<\/code>.<br>4. בכל מקרה רץ <code>finally<\/code>.<br>5. ממשיכים לשורה שאחרי הבלוק."}], "id": "exc1", "sec": "exceptions"}, {"t": "חריגות: סדר ועץ ירושה", "w": "12%", "items": [{"c": "רק <b>except אחד<\/b> רץ: הראשון מלמעלה שמתאים. חריגה-אבא תופסת גם ילדים, לכן את הילד כותבים <b>לפני<\/b> האבא.", "code": "try:\n    int(\"x\")\nexcept Exception:\n    print(\"1\")\nexcept ValueError:\n    print(\"2\")", "q": "מה יודפס?", "o": ["1", "2", "1 / 2", "ValueError"], "h": ["ValueError היא ילדה של Exception. מי מתאים ראשון מלמעלה?", "הראשון שמתאים תופס ולא ממשיכים לבדוק את השאר."], "e": "<code>except Exception<\/code> מופיע ראשון ותופס כל חריגה רגילה, כולל <code>ValueError<\/code>, אז <code>except ValueError<\/code> לעולם לא ירוץ. זו הטעות שחזרה אצלך.", "id": "1-0"}, {"c": "העץ שצריך לזכור:<pre class=\"code\">Exception\n ├ ArithmeticError → ZeroDivisionError\n ├ LookupError → IndexError, KeyError\n ├ ValueError\n ├ TypeError\n └ NameError<\/pre>", "q": "איזו חריגה לא תיתפס על ידי except LookupError?", "o": ["ZeroDivisionError", "IndexError", "KeyError", "LookupError עצמה"], "h": ["מי יושבת מתחת ל-LookupError בעץ?", "ZeroDivisionError יושבת בענף אחר, ArithmeticError."], "e": "<code>IndexError<\/code> ו-<code>KeyError<\/code> הן ילדות של <code>LookupError<\/code>. <code>ZeroDivisionError<\/code> שייכת לענף <code>ArithmeticError<\/code>.", "id": "1-1"}, {"c": "חריגה שאין לה except מתאים ממשיכה למעלה. אבל <code>finally<\/code> רץ בדרך החוצה.", "code": "try:\n    try:\n        int(\"x\")\n    except TypeError:\n        print(\"T\")\n    finally:\n        print(\"F\")\nexcept ValueError:\n    print(\"V\")", "q": "מה יודפס?", "o": ["F / V", "T / V", "V / F", "F"], "h": ["int(\"x\") זורק ValueError. האם הפנימי תופס אותו?", "הפנימי לא תופס, אבל ה-finally שלו רץ לפני שהחריגה יוצאת החוצה."], "e": "הפנימי תופס רק <code>TypeError<\/code>, אז <code>ValueError<\/code> ממשיכה החוצה. בדרך רץ <code>finally<\/code> (F), ואז החיצוני תופס (V).", "id": "1-2"}, {"c": "אפשר לתפוס כמה סוגים בבת אחת עם טאפל: <code>except (A, B):<\/code>", "code": "try:\n    [][0]\nexcept (KeyError, IndexError):\n    print(\"ok\")", "q": "מה יודפס?", "o": ["ok", "KeyError", "IndexError", "לא יודפס כלום"], "h": ["[][0] הוא גישה לאינדקס 0 ברשימה ריקה. איזו חריגה?", "IndexError נמצאת בטאפל, אז ה-except תופס."], "e": "<code>[][0]<\/code> זורק <code>IndexError<\/code>, והיא ברשימה של ה-except, לכן מודפס <code>ok<\/code>.", "id": "1-3"}, {"id": "x-exc2-k", "q": "אילו שני except יתפסו את החריגה מ-int(\"x\")? (בחר שתיים)", "o": ["except ValueError:", "except Exception:", "except TypeError:", "except LookupError:", "except ArithmeticError:"], "h": ["איזו חריגה זורק int(\"x\")?", "ValueError, ומי האבא שלה?"], "e": "<code>int(\"x\")<\/code> זורק <code>ValueError<\/code>. היא נתפסת גם על ידי האבא <code>Exception<\/code>.", "k": 2}], "intro": [{"h": "חריגות הן מחלקות עם ירושה", "t": "כל חריגה היא מחלקה, ויש ביניהן עץ ירושה, בדיוק כמו ב-Java. <code>except<\/code> של אבא תופס גם את כל הילדים שלו.", "code": "Exception\n ├── ArithmeticError\n │    └── ZeroDivisionError\n ├── LookupError\n │    ├── IndexError\n │    └── KeyError\n ├── ValueError\n ├── TypeError\n └── NameError"}, {"h": "רק except אחד רץ", "t": "Python בודק את ה-except-ים <b>מלמעלה למטה<\/b>. הראשון שמתאים תופס, והשאר לא נבדקים בכלל. כאן <code>IndexError<\/code> היא גם <code>LookupError<\/code>, אז הראשון מנצח.", "code": "try:\n    [1, 2][5]\nexcept LookupError:\n    print(\"lookup\")\nexcept IndexError:\n    print(\"index\")", "out": "lookup"}, {"h": "הכלל: ילד לפני אבא", "t": "כדי שה-except הספציפי ירוץ, כותבים אותו <b>לפני<\/b> האבא. אחרת הוא לעולם לא יגיע לתור.", "code": "try:\n    [1, 2][5]\nexcept IndexError:\n    print(\"index\")\nexcept LookupError:\n    print(\"lookup\")", "out": "index"}, {"h": "חריגה שלא נתפסה עולה למעלה", "t": "אם אין except מתאים, החריגה יוצאת מהפונקציה וממשיכה למי שקרא לה, כמו ב-Java. בדרך החוצה <code>finally<\/code> עדיין רץ.", "code": "def f():\n    try:\n        int(\"x\")\n    finally:\n        print(\"cleanup\")\n\ntry:\n    f()\nexcept ValueError:\n    print(\"caught outside\")", "out": "cleanup\ncaught outside"}, {"h": "כמה סוגים בבת אחת", "t": "אפשר לתפוס כמה סוגים עם טאפל, ולקבל את אובייקט החריגה עם <code>as<\/code>.", "code": "try:\n    {}[\"k\"]\nexcept (KeyError, IndexError) as e:\n    print(\"caught\", type(e).__name__)", "out": "caught KeyError"}], "id": "exc2", "sec": "exceptions"}, {"t": "חריגות: raise, args, assert", "w": "12%", "items": [{"c": "<code>raise<\/code> לבד בתוך except זורק מחדש את אותה חריגה כלפי מעלה.", "code": "try:\n    try:\n        raise KeyError(\"k\")\n    except KeyError:\n        print(\"in\")\n        raise\nexcept KeyError:\n    print(\"out\")", "q": "מה יודפס?", "o": ["in / out", "in", "out", "KeyError"], "h": ["מה עושה raise בלי כלום אחריו?", "הוא מעביר את אותה חריגה החוצה, והחיצוני תופס."], "e": "הפנימי מדפיס <code>in<\/code>, <code>raise<\/code> זורק שוב, והחיצוני מדפיס <code>out<\/code>.", "id": "2-0"}, {"c": "<code>e.args<\/code> הוא <b>טאפל<\/b> של כל מה שהעברת לחריגה.", "code": "try:\n    raise ValueError(\"bad\", 42)\nexcept ValueError as e:\n    print(e.args[1])", "q": "מה יודפס?", "o": ["42", "bad", "('bad', 42)", "1"], "h": ["args הוא טאפל. מה יושב באינדקס 1?", "האינדקס הראשון הוא 0 (\"bad\"), אז 1 הוא האיבר השני."], "e": "<code>args == (\"bad\", 42)<\/code>, ולכן <code>args[1]<\/code> הוא <code>42<\/code>.", "id": "2-1"}, {"c": "<code>assert תנאי, הודעה<\/code> זורק <code>AssertionError<\/code> כשהתנאי False. ההודעה נכנסת לחריגה.", "code": "try:\n    assert 1 > 2, \"no\"\nexcept AssertionError as e:\n    print(e)", "q": "מה יודפס?", "o": ["no", "AssertionError", "1 > 2", "לא יודפס כלום"], "h": ["האם 1 > 2 נכון?", "print(e) מדפיס את ההודעה שנכנסה לחריגה."], "e": "התנאי False, נזרק <code>AssertionError(\"no\")<\/code>, ו-<code>print(e)<\/code> מדפיס את <code>no<\/code>.", "id": "2-2"}, {"c": "חריגה משלך: יורשים מ-<code>Exception<\/code>. ואז <code>except Exception<\/code> תופס אותה.", "code": "class E(Exception):\n    pass\n\ntry:\n    raise E()\nexcept Exception as e:\n    print(isinstance(e, E))", "q": "מה יודפס?", "o": ["True", "False", "E", "שגיאה"], "h": ["E יורשת מ-Exception, אז Exception תופס אותה. מה האובייקט e?", "e הוא בדיוק האובייקט מסוג E שנזרק."], "e": "<code>e<\/code> הוא מופע של <code>E<\/code>, לכן <code>isinstance(e, E)<\/code> הוא <code>True<\/code>.", "id": "2-3"}, {"id": "x-exc3-k", "q": "אילו שתי חריגות יורשות מ-Exception? (בחר שתיים)", "o": ["ValueError", "KeyError", "KeyboardInterrupt", "SystemExit", "BaseException"], "h": ["שתיים מהרשימה יורשות ישר מ-BaseException.", "KeyboardInterrupt ו-SystemExit לא נתפסות ב-except Exception."], "e": "<code>ValueError<\/code> ו-<code>KeyError<\/code> הן ילדות של <code>Exception<\/code>. <code>KeyboardInterrupt<\/code> ו-<code>SystemExit<\/code> יורשות ישר מ-<code>BaseException<\/code>.", "k": 2}], "intro": [{"h": "raise: לזרוק חריגה בעצמך", "t": "<code>raise<\/code> זורק חריגה, כמו <code>throw<\/code> ב-Java. נותנים לה הודעה בסוגריים.", "code": "def check(age):\n    if age < 0:\n        raise ValueError(\"negative age\")\n    return age\n\ntry:\n    check(-1)\nexcept ValueError as e:\n    print(e)", "out": "negative age"}, {"h": "e.args: מה נשלח לחריגה", "t": "<code>e.args<\/code> הוא <b>טאפל<\/b> של כל הערכים שהעברת לחריגה. האינדקס מתחיל ב-0, כמו מערך ב-C.", "code": "try:\n    raise ValueError(\"bad\", 42)\nexcept ValueError as e:\n    print(e.args)\n    print(e.args[0])", "out": "('bad', 42)\nbad"}, {"h": "raise לבד: לזרוק שוב", "t": "בתוך except, <code>raise<\/code> בלי כלום אחריו זורק <b>שוב את אותה חריגה<\/b> למעלה. כך אפשר לרשום ביומן ובכל זאת להעביר את הבעיה הלאה.", "code": "try:\n    try:\n        1 / 0\n    except ZeroDivisionError:\n        print(\"log it\")\n        raise\nexcept ZeroDivisionError:\n    print(\"handled above\")", "out": "log it\nhandled above"}, {"h": "assert: בדיקת הנחה", "t": "<code>assert תנאי, הודעה<\/code> זורק <code>AssertionError<\/code> כשהתנאי False. כמו <code>assert<\/code> מ-<code>assert.h<\/code> ב-C.", "code": "x = 5\nassert x > 0, \"must be positive\"\nassert x > 10, \"too small\"", "out": "AssertionError: too small"}, {"h": "חריגה משלך", "t": "יוצרים מחלקה שיורשת מ-<code>Exception<\/code>. מעכשיו אפשר לזרוק ולתפוס אותה כמו כל חריגה.", "code": "class NoMoney(Exception):\n    pass\n\ntry:\n    raise NoMoney(\"balance is 0\")\nexcept NoMoney as e:\n    print(\"caught:\", e)", "out": "caught: balance is 0"}], "id": "exc3", "sec": "exceptions"}, {"id": "exc4", "t": "חריגות: BaseException וחריגות מותאמות", "intro": [{"h": "BaseException מעל Exception", "t": "בראש העץ עומדת <code>BaseException<\/code>. מתחתיה <code>Exception<\/code>, אבל גם <code>KeyboardInterrupt<\/code> (Ctrl+C) ו-<code>SystemExit<\/code>. לכן <code>except Exception<\/code> <b>לא<\/b> תופס אותן, וזה טוב. <code>except:<\/code> בלי סוג תופס הכל.", "code": "print(issubclass(KeyboardInterrupt, Exception))\nprint(issubclass(KeyboardInterrupt, BaseException))", "out": "False\nTrue"}, {"h": "להחליף חריגה בתוך except", "t": "<code>raise<\/code> לבד זורק שוב את אותה חריגה. <code>raise TypeError(...)<\/code> בתוך except זורק <b>חריגה חדשה<\/b> במקום הקודמת.", "code": "try:\n    try:\n        int(\"x\")\n    except ValueError:\n        raise TypeError(\"converted\")\nexcept TypeError as e:\n    print(type(e).__name__, e)", "out": "TypeError converted"}, {"h": "חריגה מותאמת עם מידע", "t": "אפשר לתת לחריגה משלך <code>__init__<\/code> שקורא ל-<code>super().__init__(הודעה)<\/code> ושומר מידע נוסף. ואפשר לבנות עץ: אבא כללי לכל האפליקציה, וילדים ספציפיים.", "code": "class BankError(Exception):\n    pass\n\nclass NoFunds(BankError):\n    def __init__(self, need):\n        super().__init__(\"need \" + str(need))\n        self.need = need\n\ntry:\n    raise NoFunds(50)\nexcept BankError as e:\n    print(e, e.need)", "out": "need 50 50"}, {"h": "חריגה עוברת בין פונקציות", "t": "חריגה שלא נתפסה בפונקציה עולה לפונקציה שקראה לה, וממשיכה למעלה עד שמישהו תופס. כמו ב-Java.", "code": "def inner():\n    return 1 / 0\n\ndef outer():\n    try:\n        return inner()\n    except ArithmeticError:\n        return \"caught\"\n\nprint(outer())", "out": "caught"}, {"h": "מלכודת: print של חריגה עם כמה ערכים", "t": "חריגה עם ערך אחד מודפסת כהודעה. עם <b>כמה ערכים<\/b> היא מודפסת כטאפל.", "code": "try:\n    raise ValueError(\"a\", \"b\")\nexcept ValueError as e:\n    print(e)", "out": "('a', 'b')"}], "items": [{"id": "n-exc4-1", "q": "מה יודפס?", "o": ["B", "A", "A / B", "שום דבר"], "h": ["האם SystemExit יורשת מ-Exception?", "היא יורשת ישר מ-BaseException."], "e": "<code>SystemExit<\/code> לא יורשת מ-<code>Exception<\/code>, ולכן רק <code>except BaseException<\/code> תופס.", "code": "try:\n    raise SystemExit\nexcept Exception:\n    print(\"A\")\nexcept BaseException:\n    print(\"B\")"}, {"id": "n-exc4-2", "q": "מה יודפס?", "o": ["app", "db", "app / db", "DbError"], "h": ["DbError היא ילדה של AppError.", "הראשון מלמעלה שמתאים מנצח."], "e": "<code>DbError<\/code> היא גם <code>AppError<\/code>, וה-except שלה כתוב ראשון.", "code": "class AppError(Exception):\n    pass\n\nclass DbError(AppError):\n    pass\n\ntry:\n    raise DbError()\nexcept AppError:\n    print(\"app\")\nexcept DbError:\n    print(\"db\")"}, {"id": "n-exc4-3", "q": "מה יודפס?", "o": ["7 ('err',)", "7 err", "err 7", "7 (7,)"], "h": ["מה נשלח ל-super().__init__?", "args הוא טאפל, גם עם ערך אחד."], "e": "<code>super().__init__(\"err\")<\/code> קובע <code>args == ('err',)<\/code>, ו-<code>code<\/code> נשמר בנפרד.", "code": "class E(Exception):\n    def __init__(self, code):\n        super().__init__(\"err\")\n        self.code = code\n\ntry:\n    raise E(7)\nexcept E as x:\n    print(x.code, x.args)"}, {"id": "n-exc4-4", "q": "אילו שתי חריגות לא ייתפסו על ידי except Exception? (בחר שתיים)", "o": ["KeyboardInterrupt", "SystemExit", "ValueError", "ZeroDivisionError", "KeyError"], "h": ["מי יורשת ישר מ-BaseException?", "Ctrl+C ויציאה מהתוכנית."], "e": "<code>KeyboardInterrupt<\/code> ו-<code>SystemExit<\/code> יורשות מ-<code>BaseException<\/code> ולא מ-<code>Exception<\/code>.", "k": 2}, {"id": "n-exc4-5", "q": "מה יודפס?", "o": ["('a', 'b')", "a b", "a", "ValueError"], "h": ["כמה ערכים נשלחו לחריגה?", "עם כמה ערכים, print מציג את הטאפל."], "e": "עם יותר מערך אחד, <code>str(e)<\/code> מציג את כל ה-<code>args<\/code> כטאפל.", "code": "try:\n    raise ValueError(\"a\", \"b\")\nexcept ValueError as e:\n    print(e)"}, {"id": "n-exc4-6", "q": "מה יודפס?", "o": ["TypeError", "ValueError", "ValueError / TypeError", "שום דבר"], "h": ["ה-except הפנימי זורק חריגה חדשה.", "מה סוג החריגה שמגיעה לחיצוני?"], "e": "בתוך ה-except נזרקה <code>TypeError<\/code> חדשה. החיצוני תופס אותה ומדפיס את השם שלה.", "code": "try:\n    try:\n        int(\"x\")\n    except ValueError:\n        raise TypeError()\nexcept Exception as e:\n    print(type(e).__name__)"}], "sec": "exceptions", "w": "12%"}, {"t": "מחרוזות: הטעויות הקבועות", "w": "9.5%", "items": [{"c": "חיתוך <code>s[start:end]<\/code>: ההתחלה כלולה, הסוף <b>לא<\/b> כלול. מספר שלילי סופר מהסוף. כמו מערך ב-C, האינדקס הראשון הוא 0.", "code": "s = \"Python\"\nprint(s[1:4], s[-2:])", "q": "מה יודפס?", "o": ["yth on", "Pyth on", "yth hon", "yt on"], "h": ["s[1:4] לוקח אינדקסים 1, 2, 3.", "s[-2:] הם שני התווים האחרונים."], "e": "אינדקסים 1 עד 3 הם <code>yth<\/code>, ושני האחרונים <code>on<\/code>.", "id": "5-0"}, {"c": "מחרוזת <b>immutable<\/b>: אי אפשר לשנות תו במקום (בניגוד ל-<code>char[]<\/code> ב-C).", "code": "s = \"abc\"\ns[0] = \"x\"", "q": "מה קורה?", "o": ["TypeError", "s הופך ל-xbc", "ValueError", "לא קורה כלום"], "h": ["האם מחרוזת ב-Python ניתנת לשינוי?", "מנסים לשים ערך בתוך מחרוזת, והיא לא תומכת בזה."], "e": "מחרוזות לא תומכות בהשמה לאינדקס, ולכן <code>TypeError<\/code>. יוצרים מחרוזת חדשה במקום.", "id": "5-1"}, {"c": "<code>split(\",\")<\/code> לא מוחק ריקים. שני פסיקים רצופים נותנים מחרוזת ריקה ברשימה.", "code": "print(\"a,b,,c\".split(\",\"))", "q": "מה יודפס?", "o": ["['a', l\", 3))"}], "sec": "strings", "w": "9.5%"}, {"t": "OOP: מחלקה ואובייקט", "w": "28.5%", "items": [{"c": "משתנה שמוגדר בגוף המחלקה הוא <b>של המחלקה<\/b> (כמו <code>static<\/code> ב-Java). כולם חולקים אותו.", "code": "class C:\n    n = 0\n    def __init__(self):\n        C.n += 1\n\nC()\nC()\nprint(C.n)", "q": "מה יודפס?", "o": ["2", "0", "1", "שגיאה"], "h": ["כמה פעמים נקרא __init__?", "כל יצירת אובייקט מעלה את אותו C.n."], "e": "נוצרו שני אובייקטים, וכל אחד העלה את <code>C.n<\/code>. התוצאה <code>2<\/code>.", "id": "6-0"}, {"c": "כשמשימים <code>a.x = 5<\/code> על אובייקט, נוצר משתנה <b>אצל האובייקט<\/b> ולא משתנה של המחלקה.", "code": "class A:\n    x = 1\n\na = A()\na.x = 5\nprint(A.x, a.x)", "q": "מה יודפס?", "o": ["1 5", "5 5", "1 1", "5 1"], "h": ["האם השמה דרך a משנה את A?", "היא יוצרת x חדש רק ב-a."], "e": "<code>a.x = 5<\/code> יצר תכונה אישית ב-<code>a<\/code>. <code>A.x<\/code> נשאר 1.", "id": "6-1"}, {"c": "<code>super().__init__()<\/code> קורא לבנאי של האבא. בלי זה, בנאי האבא לא רץ.", "code": "class A:\n    def __init__(self):\n        print(\"A\")\n\nclass B(A):\n    def __init__(self):\n        super().__init__()\n        print(\"B\")\n\nB()", "q": "מה יודפס?", "o": ["A / B", "B / A", "B", "A"], "h": ["מה הדבר הראשון שרץ בבנאי של B?", "super().__init__() קורא ל-A לפני print של B."], "e": "הקריאה ל-<code>super().__init__()<\/code> באה ראשונה, לכן A ואז B.", "id": "6-2"}, {"c": "<code>__str__<\/code> קובע מה <code>print<\/code> מדפיס לאובייקט. כמו <code>toString()<\/code> ב-Java.", "code": "class P:\n    def __str__(self):\n        return \"P!\"\n\nprint(P())", "q": "מה יודפס?", "o": ["P!", "<__main__.P object>", "P", "שגיאה"], "h": ["מי נקרא כש-print מקבל אובייקט?", "print קורא ל-__str__ ומדפיס מה שהוא מחזיר."], "e": "<code>print<\/code> קורא ל-<code>__str__<\/code> ומדפיס <code>P!<\/code>.", "id": "6-3"}, {"id": "x-oop1-k", "q": "אילו שני משפטים נכונים לגבי self? (בחר שתיים)", "o": ["הוא הפרמטר הראשון של מתודה רגילה", "Python מעביר אותו לבד בקריאה obj.m()", "זו מילה שמורה ואסור לשנות את שמו", "צריך להעביר אותו ידנית בכל קריאה", "הוא מצביע למחלקה ולא לאובייקט"], "h": ["self הוא רק שם מקובל, לא מילה שמורה.", "בקריאה obj.m() האובייקט נשלח אוטומטית."], "e": "<code>self<\/code> הוא הפרמטר הראשון, ו-Python מעביר אותו לבד. זה שם מקובל ולא מילה שמורה.", "k": 2}], "intro": [{"h": "מחלקה ואובייקט", "t": "<code>__init__<\/code> הוא הבנאי. <code>self<\/code> הוא <code>this<\/code> של Java, אבל כותבים אותו במפורש כפרמטר ראשון. יוצרים אובייקט בלי <code>new<\/code>.", "code": "class Dog:\n    def __init__(self, name):\n        self.name = name\n\n    def bark(self):\n        return self.name + \" says woof\"\n\nd = Dog(\"Rex\")\nprint(d.bark())", "out": "Rex says woof"}, {"h": "משתנה מחלקה מול משתנה אובייקט", "t": "משתנה שמוגדר בגוף המחלקה משותף לכולם, כמו <code>static<\/code> ב-Java. משתנה עם <code>self.<\/code> שייך לאובייקט אחד.", "code": "class Counter:\n    total = 0\n    def __init__(self):\n        Counter.total += 1\n        self.id = Counter.total\n\na = Counter()\nb = Counter()\nprint(Counter.total, a.id, b.id)", "out": "2 1 2"}, {"h": "super(): לקרוא לאבא", "t": "בבן, <code>super().__init__()<\/code> מריץ את הבנאי של האבא. בלי זה, הבנאי של האבא לא רץ בכלל.", "code": "class Animal:\n    def __init__(self):\n        print(\"Animal\")\n\nclass Cat(Animal):\n    def __init__(self):\n        super().__init__()\n        print(\"Cat\")\n\nCat()", "out": "Animal\nCat"}, {"h": "__str__: מה print מציג", "t": "<code>__str__<\/code> קובע מה <code>print<\/code> מדפיס לאובייקט, כמו <code>toString()<\/code> ב-Java. בלי זה מודפס משהו כמו <code>&lt;__main__.Dog object at 0x...&gt;<\/code>.", "code": "class Dog:\n    def __init__(self, name):\n        self.name = name\n    def __str__(self):\n        return \"Dog \" + self.name\n\nprint(Dog(\"Rex\"))", "out": "Dog Rex"}], "id": "oop1", "sec": "oop"}, {"t": "OOP: ירושה והשוואה", "w": "28.5%", "items": [{"c": "מתודה בבן <b>דורסת<\/b> מתודה באבא עם אותו שם.", "code": "class A:\n    def hi(self):\n        return \"A\"\n\nclass B(A):\n    def hi(self):\n        return \"B\"\n\nprint(B().hi())", "q": "מה יודפס?", "o": ["B", "A", "AB", "שגיאה"], "h": ["ל-B יש מתודה בשם hi?", "המתודה של הבן מנצחת."], "e": "<code>B<\/code> מגדירה <code>hi<\/code> בעצמה, ולכן היא דורסת את של <code>A<\/code>.", "id": "7-0"}, {"c": "<code>super().hi()<\/code> קורא למתודה של האבא, ואפשר להמשיך ולהוסיף עליה.", "code": "class A:\n    def hi(self):\n        return \"A\"\n\nclass B(A):\n    def hi(self):\n        return super().hi() + \"B\"\n\nprint(B().hi())", "q": "מה יודפס?", "o": ["AB", "BA", "B", "A"], "h": ["מה מחזיר super().hi()?", "קודם A, ואז מצרפים B."], "e": "<code>super().hi()<\/code> נותן <code>\"A\"<\/code>, ואחריו מצורף <code>\"B\"<\/code>: <code>AB<\/code>.", "id": "7-1"}, {"c": "<code>isinstance(obj, Cls)<\/code>: האם האובייקט מהמחלקה או מצאצאיה. <code>issubclass(A, B)<\/code>: האם A יורשת מ-B. הכיוון חשוב.", "code": "class A: pass\nclass B(A): pass\n\nprint(isinstance(B(), A), isinstance(A(), B))", "q": "מה יודפס?", "o": ["True False", "True True", "False True", "False False"], "h": ["B יורשת מ-A, אז B() הוא גם A.", "אבל A() לא נחשב B."], "e": "אובייקט של בן הוא גם מופע של האבא. ההפך לא נכון.", "id": "7-2"}, {"c": "בירושה מרובה Python מחפש משמאל לימין לפי סדר האבות ב-<code>class C(A, B)<\/code>.", "code": "class A:\n    def f(self): return \"A\"\n\nclass B:\n    def f(self): return \"B\"\n\nclass C(A, B):\n    pass\n\nprint(C().f())", "q": "מה יודפס?", "o": ["A", "B", "AB", "שגיאה"], "h": ["מה הסדר ב-class C(A, B)?", "מחפשים קודם ב-A."], "e": "<code>C<\/code> לא מגדירה <code>f<\/code>, אז מחפשים ב-<code>A<\/code> קודם ומוצאים. התוצאה <code>A<\/code>.", "id": "7-3"}, {"c": "בלי <code>__eq__<\/code>, הסימן <code>==<\/code> בודק <b>זהות<\/b>: האם זה אותו אובייקט בזיכרון.", "code": "class P:\n    pass\n\na = P()\nb = P()\nprint(a == b, a == a)", "q": "מה יודפס?", "o": ["False True", "True True", "False False", "True False"], "h": ["האם a ו-b אותו אובייקט?", "a == a משווה אובייקט לעצמו."], "e": "<code>a<\/code> ו-<code>b<\/code> שני אובייקטים נפרדים, אז <code>False<\/code>. <code>a == a<\/code> זהה, <code>True<\/code>.", "id": "7-4"}, {"id": "x-oop2-k", "q": "class A: pass ו-class B(A): pass. אילו שני ביטויים מחזירים True? (בחר שתיים)", "o": ["isinstance(B(), A)", "issubclass(B, A)", "issubclass(A, B)", "isinstance(A(), B)", "B() is A()"], "h": ["B יורשת מ-A, לא ההפך.", "is בודק אם זה אותו אובייקט."], "e": "<code>B<\/code> יורשת מ-<code>A<\/code>, אז <code>isinstance(B(), A)<\/code> ו-<code>issubclass(B, A)<\/code> נכונים.", "k": 2}], "intro": [{"h": "ירושה ודריסה", "t": "<code>class B(A)<\/code> אומר ש-B יורשת מ-A, כמו <code>extends<\/code>. מתודה בבן עם אותו שם <b>דורסת<\/b> את של האבא. עם <code>super()<\/code> אפשר להשתמש גם בגרסה של האבא.", "code": "class A:\n    def hi(self):\n        return \"A\"\n\nclass B(A):\n    def hi(self):\n        return super().hi() + \"B\"\n\nprint(B().hi())", "out": "AB"}, {"h": "isinstance ו-issubclass", "t": "<code>isinstance(obj, Cls)<\/code> בודק אובייקט. <code>issubclass(A, B)<\/code> שואל: <b>האם A יורשת מ-B?<\/b> הכיוון חשוב.", "code": "class A: pass\nclass B(A): pass\n\nprint(issubclass(B, A), issubclass(A, B))\nprint(isinstance(B(), A))", "out": "True False\nTrue"}, {"h": "ירושה מרובה", "t": "ב-Python אפשר לרשת מכמה מחלקות (ב-Java לא). המתודה נמצאת לפי סדר החיפוש, <code>__mro__<\/code>: קודם המחלקה עצמה, ואז האבות <b>משמאל לימין<\/b>.", "code": "class A: pass\nclass B: pass\nclass C(A, B): pass\n\nprint([k.__name__ for k in C.__mro__])", "out": "['C', 'A', 'B', 'object']"}, {"h": "== מול is", "t": "<code>is<\/code> בודק אם זה <b>אותו אובייקט<\/b> בזיכרון, כמו השוואת מצביעים ב-C. <code>==<\/code> משתמש ב-<code>__eq__<\/code>, ובלעדיו הוא מתנהג כמו <code>is<\/code>.", "code": "class P:\n    def __init__(self, x):\n        self.x = x\n    def __eq__(self, other):\n        return self.x == other.x\n\na = P(1)\nb = P(1)\nprint(a == b, a is b)", "out": "True False"}], "id": "oop2", "sec": "oop"}, {"t": "OOP: כימוס ומתודות מיוחדות", "w": "28.5%", "items": [{"c": "שם עם שני קווים תחתונים בהתחלה (<code>__s<\/code>) משתנה מאחורי הקלעים ל-<code>_A__s<\/code>. זה \"private\" של Python.", "code": "class A:\n    def __init__(self):\n        self.__s = 1\n\nprint(hasattr(A(), \"__s\"))", "q": "מה יודפס?", "o": ["False", "True", "1", "שגיאה"], "h": ["איך נשמר השם בפועל?", "השם האמיתי הוא _A__s, לא __s."], "e": "הפייתון מחליף את השם ל-<code>_A__s<\/code>, ולכן <code>hasattr<\/code> עם <code>\"__s\"<\/code> נותן <code>False<\/code>.", "id": "8-0"}, {"c": "<code>@property<\/code> הופך מתודה לתכונה: קוראים בלי סוגריים. כמו getter ב-Java.", "code": "class C:\n    @property\n    def v(self):\n        return 7\n\nprint(C().v)", "q": "מה יודפס?", "o": ["7", "שגיאה", "<function>", "None"], "h": ["האם יש צורך בסוגריים אחרי v?", "property מפעיל את הפונקציה בכל גישה."], "e": "<code>@property<\/code> גורם ל-<code>C().v<\/code> להפעיל את הפונקציה ולהחזיר <code>7<\/code>.", "id": "8-1"}, {"c": "<code>@classmethod<\/code> מקבל את המחלקה (<code>cls<\/code>) ולא אובייקט. <code>@staticmethod<\/code> לא מקבל <code>self<\/code> ולא <code>cls<\/code> אוטומטית, רק את הפרמטרים שמעבירים לו.", "code": "class K:\n    n = 3\n\n    @classmethod\n    def g(cls):\n        return cls.n\n\nprint(K.g())", "q": "מה יודפס?", "o": ["3", "K", "None", "שגיאה"], "h": ["מה הוא cls?", "cls הוא K עצמה, ו-K.n הוא 3."], "e": "<code>cls<\/code> הוא <code>K<\/code>, ולכן <code>cls.n<\/code> הוא <code>3<\/code>.", "id": "8-2"}, {"id": "x-oop3-k", "q": "אילו שני משפטים נכונים לגבי @staticmethod? (בחר שתיים)", "o": ["לא מקבל self", "לא מקבל cls", "מקבל את המחלקה כפרמטר ראשון", "חייב להחזיר אובייקט", "אפשר לקרוא לו רק דרך אובייקט"], "h": ["staticmethod הוא כמו פונקציה רגילה בתוך המחלקה.", "classmethod הוא זה שמקבל cls."], "e": "<code>@staticmethod<\/code> לא מקבל לא <code>self<\/code> ולא <code>cls<\/code>. אפשר לקרוא לו גם דרך המחלקה.", "k": 2}], "intro": [{"h": "_ ו-__: פרטיות ב-Python", "t": "אין <code>private<\/code> אמיתי. <code>_x<\/code> הוא רק סימן \"פנימי, לא לגעת\". <code>__x<\/code> משנה את השם מאחורי הקלעים ל-<code>_Class__x<\/code> (name mangling).", "code": "class Account:\n    def __init__(self):\n        self._balance = 100\n        self.__pin = 1234\n\na = Account()\nprint(a._balance)\nprint(a._Account__pin)\nprint(hasattr(a, \"__pin\"))", "out": "100\n1234\nFalse"}, {"h": "@property: getter ו-setter", "t": "<code>@property<\/code> הופך מתודה לתכונה שקוראים בלי סוגריים. עם <code>@x.setter<\/code> אפשר לבדוק ערך לפני השמה, כמו getter/setter ב-Java.", "code": "class Temp:\n    def __init__(self):\n        self._c = 0\n    @property\n    def c(self):\n        return self._c\n    @c.setter\n    def c(self, v):\n        if v < -273:\n            raise ValueError(\"too cold\")\n        self._c = v\n\nt = Temp()\nt.c = 25\nprint(t.c)", "out": "25"}, {"h": "classmethod ו-staticmethod", "t": "<code>@classmethod<\/code> מקבל את המחלקה (<code>cls<\/code>). <code>@staticmethod<\/code> לא מקבל לא <code>self<\/code> ולא <code>cls<\/code>, כמו <code>static<\/code> ב-Java.", "code": "class Calc:\n    factor = 10\n    @classmethod\n    def scale(cls, x):\n        return x * cls.factor\n    @staticmethod\n    def add(a, b):\n        return a + b\n\nprint(Calc.scale(3), Calc.add(2, 3))", "out": "30 5"}, {"h": "getattr ו-setattr", "t": "עבודה עם תכונה לפי <b>שם כמחרוזת<\/b>. ל-<code>getattr<\/code> אפשר לתת ערך ברירת מחדל.", "code": "class C: pass\n\no = C()\nsetattr(o, \"x\", 7)\nprint(getattr(o, \"x\"), getattr(o, \"y\", 0))", "out": "7 0"}], "id": "oop3", "sec": "oop"}, {"id": "oop4", "t": "OOP: עקרונות, __dict__ ומטא-דאטה", "intro": [{"h": "ארבעת העקרונות", "t": "<b>הפשטה<\/b> (abstraction): חושפים רק את מה שצריך להשתמש בו.<br><b>כימוס<\/b> (encapsulation): מסתירים את המצב הפנימי.<br><b>ירושה<\/b> (inheritance): שימוש חוזר בקוד של מחלקה אחרת.<br><b>פולימורפיזם<\/b> (polymorphism): אותה קריאה, והתנהגות שונה לכל אובייקט. בדיוק כמו ב-Java."}, {"h": "פולימורפיזם בלי interface", "t": "ב-Java צריך interface משותף. ב-Python מספיק שלשני האובייקטים יש מתודה באותו שם (duck typing).", "code": "class Cat:\n    def sound(self):\n        return \"meow\"\n\nclass Dog:\n    def sound(self):\n        return \"woof\"\n\nfor a in [Cat(), Dog()]:\n    print(a.sound())", "out": "meow\nwoof"}, {"h": "__dict__: התכונות של האובייקט", "t": "לכל אובייקט יש מילון <code>__dict__<\/code> עם התכונות <b>שלו<\/b>. משתנה מחלקה נמצא ב-<code>__dict__<\/code> של המחלקה, לא של האובייקט. <code>hasattr<\/code> מחפש גם במחלקה ובאבות.", "code": "class P:\n    kind = \"point\"\n    def __init__(self):\n        self.x = 1\n\np = P()\nprint(p.__dict__)\nprint(\"kind\" in P.__dict__, \"kind\" in p.__dict__, hasattr(p, \"kind\"))", "out": "{'x': 1}\nTrue False True"}, {"h": "מטא-דאטה של מחלקה", "t": "<code>__name__<\/code> הוא שם המחלקה. <code>__module__<\/code> הוא שם המודול (<code>__main__<\/code> בקובץ שהורץ ישירות). <code>__bases__<\/code> הוא טאפל של מחלקות האב.", "code": "class A: pass\nclass B(A): pass\n\nprint(B.__name__, B.__module__)\nprint(B.__bases__)\nprint(type(B()).__name__)", "out": "B __main__\n(<class '__main__.A'>,)\nB"}], "items": [{"id": "n-oop4-1", "q": "מה יודפס?", "o": ["{'y': 2}", "{'kind': 'point', 'y': 2}", "{}", "['y']"], "h": ["kind שייך למחלקה או לאובייקט?", "__dict__ של אובייקט מכיל רק את מה שהושם דרך self."], "e": "רק <code>y<\/code> הושם על האובייקט. <code>kind<\/code> נמצא ב-<code>__dict__<\/code> של המחלקה.", "code": "class P:\n    kind = \"point\"\n    def __init__(self):\n        self.y = 2\n\nprint(P().__dict__)"}, {"id": "n-oop4-2", "q": "מה יודפס?", "o": ["(<class '__main__.A'>,)", "A", "<class '__main__.A'>", "[A]"], "h": ["__bases__ הוא טאפל.", "גם עם אב אחד יש פסיק בטאפל."], "e": "<code>__bases__<\/code> הוא <b>טאפל<\/b> של מחלקות האב, גם כשיש רק אחת.", "code": "class A: pass\nclass B(A): pass\nprint(B.__bases__)"}, {"id": "n-oop4-3", "q": "איזה עיקרון מתאר קריאה לאותה מתודה על אובייקטים שונים, כשכל אחד מתנהג אחרת?", "o": ["פולימורפיזם (polymorphism)", "כימוס (encapsulation)", "הפשטה (abstraction)", "ירושה מרובה"], "h": ["poly = הרבה, morph = צורה.", "sound() של Cat ושל Dog."], "e": "פולימורפיזם: אותה קריאה, התנהגות לפי סוג האובייקט."}, {"id": "n-oop4-4", "q": "מה יודפס?", "o": ["False True", "True True", "False False", "True False"], "h": ["x מוגדר במחלקה A, לא באובייקט.", "hasattr מחפש גם במחלקה ובאבות."], "e": "<code>x<\/code> לא נמצא ב-<code>__dict__<\/code> של האובייקט, אבל <code>hasattr<\/code> מוצא אותו דרך הירושה.", "code": "class A:\n    x = 1\nclass B(A):\n    pass\n\nb = B()\nprint(\"x\" in b.__dict__, hasattr(b, \"x\"))"}, {"id": "n-oop4-5", "q": "class K עם self.__v = 1 בבנאי. אילו שני ביטויים מחזירים True (בלי שגיאה)? (בחר שתיים)", "o": ["\"_K__v\" in K().__dict__", "K()._K__v == 1", "\"__v\" in K().__dict__", "K().__v == 1", "K.__v == 1"], "h": ["__v משנה את השם שלו.", "השם האמיתי הוא _K__v."], "e": "בגלל name mangling השם נשמר כ-<code>_K__v<\/code>. גישה ל-<code>__v<\/code> מבחוץ זורקת <code>AttributeError<\/code>.", "code": "class K:\n    def __init__(self):\n        self.__v = 1", "k": 2}, {"id": "n-oop4-6", "q": "הקובץ הורץ ישירות. מה יודפס?", "o": ["__main__", "B", "A", "main"], "h": ["__module__ הוא שם המודול שבו הוגדרה המחלקה.", "קובץ שהורץ ישירות נקרא __main__."], "e": "המחלקה הוגדרה בקובץ שהורץ ישירות, ולכן <code>__module__<\/code> הוא <code>__main__<\/code>.", "code": "class B: pass\nprint(B.__module__)"}], "sec": "oop", "w": "28.5%"}, {"id": "oop5", "t": "OOP: יהלום, is ואתחול בטוח", "intro": [{"h": "ירושת יהלום ו-super", "t": "ב\"יהלום\" שתי מחלקות יורשות מאותו אב, ומחלקה רביעית יורשת משתיהן. <code>super()<\/code> לא קורא בהכרח לאבא: הוא קורא <b>למחלקה הבאה בסדר ה-MRO<\/b>. כך כל מחלקה רצה פעם אחת בדיוק.", "code": "class A:\n    def hi(self):\n        print(\"A\")\n\nclass B(A):\n    def hi(self):\n        print(\"B\")\n        super().hi()\n\nclass C(A):\n    def hi(self):\n        print(\"C\")\n        super().hi()\n\nclass D(B, C):\n    def hi(self):\n        print(\"D\")\n        super().hi()\n\nD().hi()\nprint([k.__name__ for k in D.__mro__])", "out": "D\nB\nC\nA\n['D', 'B', 'C', 'A', 'object']"}, {"h": "is ו-is not", "t": "<code>==<\/code> משווה ערכים. <code>is<\/code> בודק אם זה <b>אותו אובייקט<\/b>, כמו השוואת מצביעים ב-C. משווים ל-<code>None<\/code> תמיד עם <code>is<\/code>.", "code": "a = [1]\nb = [1]\nc = a\nprint(a == b, a is b, a is c, a is not b)", "out": "True False True True"}, {"h": "אתחול עם ברירות מחדל ובדיקה", "t": "פרמטרים עם ברירת מחדל מאפשרים אתחול חלקי. אפשר להעביר ארגומנטים לפי שם, בכל סדר. בודקים ערכים ב-<code>__init__<\/code> וזורקים חריגה כשמשהו לא תקין.", "code": "class User:\n    def __init__(self, name, age=0):\n        if age < 0:\n            raise ValueError(\"age < 0\")\n        self.name = name\n        self.age = age\n\nu = User(age=30, name=\"Dan\")\nprint(u.name, u.age)", "out": "Dan 30"}, {"h": "מלכודת: ברירת מחדל שניתנת לשינוי", "t": "רשימה כברירת מחדל נוצרת <b>פעם אחת<\/b> ומשותפת לכל האובייקטים! הפתרון: <code>items=None<\/code>, ובתוך הבנאי ליצור רשימה חדשה.", "code": "class Box:\n    def __init__(self, items=[]):\n        self.items = items\n\na = Box()\nb = Box()\na.items.append(1)\nprint(b.items)", "out": "[1]"}], "items": [{"id": "n-oop5-1", "q": "מה יודפס?", "o": ["C", "A", "B", "D"], "h": ["MRO של D: D, B, C, A.", "ל-B אין f משלה, אז ממשיכים ל-C."], "e": "סדר החיפוש הוא D, B, C, A. ל-B אין <code>f<\/code>, ול-C יש, ולכן <code>C<\/code>.", "code": "class A:\n    def f(self): return \"A\"\nclass B(A):\n    pass\nclass C(A):\n    def f(self): return \"C\"\nclass D(B, C):\n    pass\n\nprint(D().f())"}, {"id": "n-oop5-2", "q": "מה יודפס?", "o": ["[1]", "[]", "None", "שגיאה"], "h": ["כמה רשימות נוצרו בפועל?", "ברירת המחדל נוצרת פעם אחת בלבד."], "e": "שני האובייקטים חולקים את <b>אותה<\/b> רשימת ברירת מחדל, אז ההוספה דרך <code>a<\/code> נראית גם ב-<code>b<\/code>.", "code": "class Box:\n    def __init__(self, items=[]):\n        self.items = items\n\na = Box()\nb = Box()\na.items.append(1)\nprint(b.items)"}, {"id": "n-oop5-3", "q": "מה יודפס?", "o": ["True False", "True True", "False False", "False True"], "h": ["a[:] יוצר עותק.", "עותק שווה בערך, אבל הוא אובייקט אחר."], "e": "<code>a[:]<\/code> יוצר רשימה חדשה עם אותם ערכים: <code>==<\/code> נכון, ו-<code>is<\/code> לא.", "code": "a = [1, 2]\nb = a[:]\nprint(a == b, a is b)"}, {"id": "n-oop5-4", "q": "מה יודפס?", "o": ["age < 0", "Dan -5", "ValueError", "שום דבר"], "h": ["הבדיקה ב-__init__ נכשלת.", "print(e) מדפיס את ההודעה."], "e": "<code>age<\/code> שלילי, הבנאי זורק <code>ValueError(\"age &lt; 0\")<\/code>, ו-<code>print(e)<\/code> מדפיס את ההודעה.", "code": "class User:\n    def __init__(self, name, age=0):\n        if age < 0:\n            raise ValueError(\"age < 0\")\n        self.name = name\n\ntry:\n    User(\"Dan\", -5)\nexcept ValueError as e:\n    print(e)"}, {"id": "n-oop5-5", "q": "אילו שני משפטים נכונים לגבי super()? (בחר שתיים)", "o": ["קורא למחלקה הבאה לפי סדר ה-MRO", "בירושה מרובה הוא עשוי לקרוא למחלקה אחות ולא לאבא", "תמיד קורא למחלקה object", "אסור להשתמש בו בתוך __init__", "הוא יוצר אובייקט חדש של מחלקת האב"], "h": ["תחשוב על דוגמת היהלום: B קרא ל-C.", "super הולך לפי __mro__."], "e": "<code>super()<\/code> הולך למחלקה הבאה ב-MRO. ביהלום, <code>super()<\/code> של B הגיע ל-C, שהיא \"אחות\".", "k": 2}, {"id": "n-oop5-6", "q": "מה יודפס?", "o": ["B / A", "A / B", "B", "A"], "h": ["מה רץ קודם בבנאי של B?", "print(\"B\") כתוב לפני super()."], "e": "הבנאי של B מדפיס <code>B<\/code>, ורק אחר כך קורא ל-<code>super().__init__()<\/code> שמדפיס <code>A<\/code>.", "code": "class A:\n    def __init__(self):\n        print(\"A\")\n\nclass B(A):\n    def __init__(self):\n        print(\"B\")\n        super().__init__()\n\nB()"}], "sec": "oop", "w": "28.5%"}, {"t": "מתקדם: comprehension, lambda, generator", "w": "24%", "items": [{"c": "<code>[ביטוי for x in ... if תנאי]<\/code>: קודם הלולאה, אחר כך התנאי מסנן.", "code": "print([x * x for x in range(4) if x % 2 == 0])", "q": "מה יודפס?", "o": ["[0, 4]", "[0, 1, 4, 9]", "[4]", "[0, 2]"], "h": ["range(4) נותן 0,1,2,3. אילו זוגיים?", "הזוגיים הם 0 ו-2. מעלים בריבוע."], "e": "הזוגיים הם 0 ו-2, בריבוע: <code>[0, 4]<\/code>.", "id": "9-0"}, {"c": "<code>lambda<\/code> היא פונקציה קטנה בשורה אחת. אפשר ערך ברירת מחדל.", "code": "print((lambda a, b=2: a * b)(5))", "q": "מה יודפס?", "o": ["10", "7", "5", "שגיאה"], "h": ["מה ערך b אם לא העברנו אותו?", "b=2, אז 5 * 2."], "e": "<code>b<\/code> לא הועבר ולכן הוא <code>2<\/code>. התוצאה <code>10<\/code>.", "id": "9-1"}, {"c": "<code>yield<\/code> הופך פונקציה ל-generator: כל <code>next<\/code> מריץ עד ה-yield הבא וממשיך מאותו מקום.", "code": "def g():\n    yield 1\n    yield 2\n\nit = g()\nprint(next(it), next(it))", "q": "מה יודפס?", "o": ["1 2", "1 1", "2 2", "[1, 2]"], "h": ["next פעם ראשונה נותן את ה-yield הראשון.", "next שנייה ממשיכה לשני."], "e": "הקריאה הראשונה נותנת <code>1<\/code>, השנייה ממשיכה ונותנת <code>2<\/code>.", "id": "9-2"}, {"c": "<code>map<\/code> ו-<code>filter<\/code> מחזירים אובייקט עצל. עוטפים ב-<code>list<\/code> כדי לראות.", "code": "print(list(map(lambda x: x + 1, [1, 2])))", "q": "מה יודפס?", "o": ["[2, 3]", "[1, 2]", "<map object>", "[3]"], "h": ["מה עושה ה-lambda לכל איבר?", "list עוטף ומוציא את התוצאות."], "e": "ה-lambda מוסיפה 1 לכל איבר: <code>[2, 3]<\/code>.", "id": "9-3"}, {"c": "dict comprehension: <code>{מפתח: ערך for ...}<\/code>", "code": "print({k: len(k) for k in [\"a\", \"bb\"]})", "q": "מה יודפס?", "o": ["{'a': 1, 'bb': 2}", "['a', 'bb']", "{'a', 'bb'}", "{1: 'a', 2: 'bb'}"], "h": ["המפתח הוא המחרוזת, והערך הוא האורך שלה.", "len(\"bb\") הוא 2."], "e": "המפתח הוא <code>k<\/code> והערך <code>len(k)<\/code>: <code>{'a': 1, 'bb': 2}<\/code>.", "id": "9-4"}, {"id": "x-adv1-k", "q": "אילו שני ביטויים מחזירים [2, 4]? (בחר שתיים)", "o": ["[x * 2 for x in [1, 2]]", "list(map(lambda x: x * 2, [1, 2]))", "map(lambda x: x * 2, [1, 2])", "[x for x in [1, 2] if x > 1]", "(1, 2) * 2"], "h": ["map בלי list מחזיר אובייקט map.", "הסינון עם if מחזיר [2] בלבד."], "e": "ה-comprehension ו-<code>list(map(...))<\/code> נותנים <code>[2, 4]<\/code>. <code>map<\/code> לבד מחזיר אובייקט עצל.", "k": 2}], "intro": [{"h": "list comprehension", "t": "בונה רשימה בשורה אחת. הסדר: ביטוי, אחר כך <code>for<\/code>, ובסוף <code>if<\/code> שמסנן.", "code": "odd_squares = [x * x for x in range(5) if x % 2 == 1]\nprint(odd_squares)\n\n# same as:\nres = []\nfor x in range(5):\n    if x % 2 == 1:\n        res.append(x * x)", "out": "[1, 9]"}, {"h": "lambda, map, filter, sorted", "t": "<code>lambda<\/code> היא פונקציה קטנה בשורה אחת. <code>map<\/code> ו-<code>filter<\/code> מחזירים אובייקט עצל, אז עוטפים ב-<code>list<\/code>.", "code": "print(list(map(lambda x: x * 2, [1, 2])))\nprint(list(filter(lambda x: x > 1, [0, 1, 2, 3])))\nprint(sorted([\"bb\", \"a\", \"ccc\"], key=lambda s: len(s)))", "out": "[2, 4]\n[2, 3]\n['a', 'bb', 'ccc']"}, {"h": "generator ו-yield", "t": "פונקציה עם <code>yield<\/code> לא מחזירה הכל בבת אחת. כל <code>next<\/code> מריץ עד ה-yield הבא, וממשיך מאותו מקום בפעם הבאה.", "code": "def countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n\nprint(list(countdown(3)))", "out": "[3, 2, 1]"}, {"h": "closure ו-nonlocal", "t": "פונקציה פנימית זוכרת את המשתנים של החיצונית. כדי <b>לשנות<\/b> אותם צריך <code>nonlocal<\/code>.", "code": "def make_counter():\n    count = 0\n    def inc():\n        nonlocal count\n        count += 1\n        return count\n    return inc\n\nc = make_counter()\nprint(c(), c())", "out": "1 2"}], "id": "adv1", "sec": "advanced"}, {"id": "adv3", "t": "comprehension מתקדם", "intro": [{"h": "set ו-dict comprehension", "t": "סוגריים מסולסלים עם ערך אחד יוצרים <b>set<\/b> (בלי כפילויות). עם <code>מפתח: ערך<\/code> הם יוצרים <b>dict<\/b>.", "code": "print({x % 3 for x in range(6)})\nprint({x: x * x for x in range(3)})", "out": "{0, 1, 2}\n{0: 0, 1: 1, 2: 4}"}, {"h": "if לפני for מול if אחרי for", "t": "<code>a if תנאי else b<\/code> <b>לפני<\/b> ה-for משנה כל איבר, וכולם נשארים. <code>if<\/code> <b>אחרי<\/b> ה-for מסנן, ואיברים נזרקים. כמו האופרטור <code>?:<\/code> ב-C.", "code": "print([\"even\" if x % 2 == 0 else \"odd\" for x in range(3)])\nprint([x for x in range(5) if x % 2 == 0])", "out": "['even', 'odd', 'even']\n[0, 2, 4]"}, {"h": "for מקונן בשורה אחת", "t": "כמה <code>for<\/code> רצים <b>בסדר שבו הם כתובים<\/b>, כמו לולאות מקוננות: הראשון הוא החיצוני.", "code": "print([(r, c) for r in range(2) for c in range(2)])", "out": "[(0, 0), (0, 1), (1, 0), (1, 1)]"}, {"h": "מטריצות ופריסה", "t": "comprehension בתוך comprehension בונה מטריצה. <code>*<\/code> פורס רשימה לתוך רשימה אחרת.", "code": "m = [[1, 2], [3, 4]]\nprint([[row[i] for row in m] for i in range(2)])\nprint([x for row in m for x in row])\nprint([*m[0], *m[1]])", "out": "[[1, 3], [2, 4]]\n[1, 2, 3, 4]\n[1, 2, 3, 4]"}], "items": [{"id": "n-adv3-1", "q": "מה יודפס?", "o": ["{1, 2}", "{1, 2, 2}", "[1, 2, 2]", "{'a': 1, 'bb': 2, 'cc': 2}"], "h": ["סוגריים מסולסלים בלי נקודתיים יוצרים set.", "set לא שומר כפילויות."], "e": "זה set comprehension, והאורך 2 מופיע פעם אחת: <code>{1, 2}<\/code>.", "code": "print({len(w) for w in [\"a\", \"bb\", \"cc\"]})"}, {"id": "n-adv3-2", "q": "מה יודפס?", "o": ["[0, 2, 0]", "[2]", "[-1, 2, -3]", "[0, 2]"], "h": ["ה-if-else נמצא לפני ה-for.", "כל איבר נשאר, רק משתנה."], "e": "if-else לפני ה-for משנה כל איבר: שלילי הופך ל-0. שלושה איברים נשארים.", "code": "print([x if x > 0 else 0 for x in [-1, 2, -3]])"}, {"id": "n-adv3-3", "q": "מה יודפס?", "o": ["[2]", "[0, 2, 0]", "[-1, -3]", "[True]"], "h": ["ה-if אחרי ה-for.", "if אחרי for מסנן."], "e": "<code>if<\/code> אחרי ה-for מסנן, ונשאר רק <code>2<\/code>.", "code": "print([x for x in [-1, 2, -3] if x > 0])"}, {"id": "n-adv3-4", "q": "מה יודפס?", "o": ["[('x', '1'), ('x', '2'), ('y', '1'), ('y', '2')]", "[('x', '1'), ('y', '2')]", "[('x', '1'), ('y', '1'), ('x', '2'), ('y', '2')]", "['x1', 'x2', 'y1', 'y2']"], "h": ["ה-for הראשון הוא החיצוני.", "עבור x עוברים על כל 1, 2, ואז עבור y."], "e": "כמו לולאה מקוננת: <code>a<\/code> חיצוני, <code>b<\/code> פנימי. מתקבלים 4 זוגות.", "code": "print([(a, b) for a in \"xy\" for b in \"12\"])"}, {"id": "n-adv3-5", "q": "מה יודפס?", "o": ["[[1, 3], [2, 4]]", "[[1, 2], [3, 4]]", "[1, 3, 2, 4]", "[[1, 2], [1, 2]]"], "h": ["i=0 לוקח את האיבר הראשון מכל שורה.", "זו החלפת שורות בעמודות (transpose)."], "e": "לכל <code>i<\/code> לוקחים את העמודה ה-i: <code>[1, 3]<\/code> ואז <code>[2, 4]<\/code>.", "code": "m = [[1, 2], [3, 4]]\nprint([[r[i] for r in m] for i in range(2)])"}, {"id": "n-adv3-6", "q": "אילו שני ביטויים מחזירים [1, 2, 3, 4]? (בחר שתיים)", "o": ["[x for row in [[1, 2], [3, 4]] for x in row]", "[*[1, 2], *[3, 4]]", "[[1, 2], [3, 4]]", "[x for x in [[1, 2], [3, 4]]]", "[1, 2] + [[3, 4]]"], "h": ["צריך לשטח רשימה של רשימות.", "שני for, או פריסה עם *."], "e": "שני <code>for<\/code> משטחים את הרשימה, וגם <code>*<\/code> פורס את שתי הרשימות לרשימה אחת.", "k": 2}], "sec": "advanced", "w": "24%"}, {"id": "adv2", "t": "match ו-else של לולאות", "intro": [{"h": "match / case", "t": "<code>match<\/code> (מ-Python 3.10) דומה ל-<code>switch<\/code> ב-C, אבל <b>בלי נפילה<\/b> למקרה הבא ובלי <code>break<\/code>. <code>case _<\/code> הוא ברירת המחדל, ו-<code>|<\/code> הוא \"או\".", "code": "def describe(code):\n    match code:\n        case 200:\n            return \"OK\"\n        case 404 | 410:\n            return \"missing\"\n        case _:\n            return \"other\"\n\nprint(describe(200), describe(410), describe(500))", "out": "OK missing other"}, {"h": "match עם תבנית", "t": "<code>case<\/code> יכול לפרק מבנה ולשמור חלקים במשתנים. אם אף case לא מתאים ואין <code>case _<\/code>, פשוט לא קורה כלום.", "code": "point = (0, 5)\nmatch point:\n    case (0, y):\n        print(\"on y axis at\", y)\n    case (x, 0):\n        print(\"on x axis at\", x)\n    case _:\n        print(\"somewhere\")", "out": "on y axis at 5"}, {"h": "else של for", "t": "ה-<code>else<\/code> של לולאה רץ <b>רק אם הלולאה הסתיימה בלי break<\/b>. שימוש נפוץ: חיפוש שלא מצא.", "code": "for n in [1, 3, 5]:\n    if n % 2 == 0:\n        print(\"found even\")\n        break\nelse:\n    print(\"no even\")", "out": "no even"}, {"h": "else של while", "t": "אותו כלל: <code>else<\/code> רץ כשהתנאי נהיה False, אבל לא אחרי <code>break<\/code>. אם התנאי False כבר בהתחלה, ה-else רץ מיד.", "code": "i = 0\nwhile i < 3:\n    i += 1\nelse:\n    print(\"done\", i)", "out": "done 3"}, {"h": "ביטוי תנאי", "t": "<code>a if תנאי else b<\/code> בשורה אחת, כמו <code>תנאי ? a : b<\/code> ב-C.", "code": "x = 4\nprint(\"even\" if x % 2 == 0 else \"odd\")", "out": "even"}], "items": [{"id": "n-adv2-1", "q": "מה יודפס?", "o": ["missing", "OK", "other", "None"], "h": ["404 מופיע באחד ה-case-ים.", "| אומר או."], "e": "<code>404<\/code> מתאים ל-<code>case 404 | 410<\/code>, ולכן <code>missing<\/code>.", "code": "def describe(code):\n    match code:\n        case 200:\n            return \"OK\"\n        case 404 | 410:\n            return \"missing\"\n        case _:\n            return \"other\"\n\nprint(describe(404))"}, {"id": "n-adv2-2", "q": "מה יודפס?", "o": ["None", "one", "שגיאה", "2"], "h": ["האם יש case שמתאים ל-2?", "אין case _, והפונקציה מסתיימת בלי return."], "e": "אף case לא התאים, אז הפונקציה הגיעה לסוף בלי <code>return<\/code> ומחזירה <code>None<\/code>.", "code": "def f(x):\n    match x:\n        case 1:\n            return \"one\"\n\nprint(f(2))"}, {"id": "n-adv2-3", "q": "מה יודפס?", "o": ["1", "else / 1", "else / 2", "2"], "h": ["האם הלולאה הסתיימה עם break?", "אחרי break, ה-else מדולג."], "e": "ב-<code>i == 1<\/code> יש <code>break<\/code>, אז ה-<code>else<\/code> לא רץ, ומודפס רק <code>1<\/code>.", "code": "for i in range(3):\n    if i == 1:\n        break\nelse:\n    print(\"else\")\nprint(i)"}, {"id": "n-adv2-4", "q": "מה יודפס?", "o": ["E", "שום דבר", "0", "שגיאה"], "h": ["התנאי False כבר בהתחלה.", "לא היה break."], "e": "הלולאה לא רצה אף פעם, אבל גם לא היה <code>break<\/code>, ולכן ה-<code>else<\/code> רץ.", "code": "n = 0\nwhile n > 0:\n    n -= 1\nelse:\n    print(\"E\")"}, {"id": "n-adv2-5", "q": "מה יודפס?", "o": ["small", "big", "True", "5"], "h": ["האם 5 > 10?", "התנאי False, אז הערך שאחרי else."], "e": "<code>5 &gt; 10<\/code> הוא False, ולכן נבחר הערך שאחרי <code>else<\/code>.", "code": "x = 5\nprint(\"big\" if x > 10 else \"small\")"}, {"id": "n-adv2-6", "q": "מתי בלוק else של for רץ? (בחר שתיים)", "o": ["כשהלולאה הסתיימה בלי break", "כשהרשימה ריקה מההתחלה", "רק כשהיה break", "כשנזרקה חריגה בלולאה", "אף פעם, זו שגיאת תחביר"], "h": ["הכלל: else רץ אם לא היה break.", "רשימה ריקה = אין break."], "e": "ה-<code>else<\/code> רץ בכל פעם שהלולאה מסתיימת בלי <code>break<\/code>, וזה כולל רשימה ריקה.", "k": 2}], "sec": "advanced", "w": "24%"}, {"t": "קבצים ו-pathlib", "w": "24%", "items": [{"c": "<code>\"w\"<\/code> מוחק ומתחיל מחדש. <code>\"a\"<\/code> מוסיף בסוף.", "code": "with open(\"t.txt\", \"w\") as f:\n    f.write(\"A\")\nwith open(\"t.txt\", \"a\") as f:\n    f.write(\"B\")\nwith open(\"t.txt\") as f:\n    print(f.read())", "q": "מה יודפס?", "o": ["AB", "A", "B", "BA"], "h": ["מה עושה מצב a?", "a מוסיף אחרי מה שכבר כתוב."], "e": "הכתיבה הראשונה יצרה <code>A<\/code>, והשנייה הוסיפה <code>B<\/code> בסוף: <code>AB<\/code>.", "id": "10-0"}, {"c": "<code>readlines()<\/code> מחזיר רשימה, וכל שורה שומרת את ה-<code>\\n<\/code> שלה.", "code": "with open(\"t.txt\", \"w\") as f:\n    f.write(\"a\\nb\\n\")\nwith open(\"t.txt\") as f:\n    print(f.readlines())", "q": "מה יודפס?", "o": ["['a\\n', 'b\\n']", "['a', 'b']", "'a\\nb\\n'", "['a b']"], "h": ["האם ה-\\n נעלם?", "readlines לא מסיר אותו."], "e": "כל איבר ברשימה כולל ירידת שורה בסופו: <code>['a\\n', 'b\\n']<\/code>.", "id": "10-1"}, {"c": "<code>with<\/code> סוגר את הקובץ אוטומטית בסוף הבלוק, גם אם הייתה חריגה.", "code": "with open(\"t.txt\", \"w\") as f:\n    pass\n\nprint(f.closed)", "q": "מה יודפס?", "o": ["True", "False", "None", "שגיאה"], "h": ["מי סוגר את הקובץ בסיום ה-with?", "האובייקט f עדיין קיים אחרי הבלוק, אבל סגור."], "e": "<code>with<\/code> סוגר את הקובץ. <code>f.closed<\/code> הוא <code>True<\/code>.", "id": "10-2"}, {"c": "<code>FileNotFoundError<\/code> היא ילדה של <code>OSError<\/code>. אפשר לתפוס אותה גם עם האבא.", "code": "print(issubclass(FileNotFoundError, OSError))", "q": "מה יודפס?", "o": ["True", "False", "OSError", "שגיאה"], "h": ["חשוב על העץ: קובץ חסר זו שגיאת מערכת.", "ילד יורש מאבא."], "e": "<code>FileNotFoundError<\/code> יורשת מ-<code>OSError<\/code>, לכן <code>True<\/code>.", "id": "10-3"}, {"id": "x-io1-k", "q": "אילו שני משפטים נכונים לגבי with open(...)? (בחר שתיים)", "o": ["הקובץ נסגר אוטומטית בסוף הבלוק", "הקובץ נסגר גם אם נזרקה חריגה", "צריך לקרוא ל-close() בסוף", "אפשר להשתמש בו רק לקריאה", "הוא קורא את כל הקובץ לזיכרון מראש"], "h": ["זה כל הרעיון של with.", "גם חריגה לא מונעת סגירה."], "e": "<code>with<\/code> סוגר את הקובץ בסוף הבלוק, גם כשנזרקה חריגה.", "k": 2}], "intro": [{"h": "פתיחת קובץ: open", "t": "<b>גשר:<\/b> אותן אותיות כמו <code>fopen<\/code> ב-C!<br><code>\"r\"<\/code> קריאה (ברירת מחדל). <code>\"w\"<\/code> כתיבה, מוחק את מה שהיה. <code>\"a\"<\/code> הוספה בסוף. <code>\"b\"<\/code> בינארי, למשל <code>\"rb\"<\/code>."}, {"h": "with סוגר לבד", "t": "<code>with<\/code> סוגר את הקובץ בסוף הבלוק, גם אם נזרקה חריגה. לא צריך <code>close()<\/code>, בניגוד ל-<code>fclose<\/code> ב-C.", "code": "with open(\"t.txt\", \"w\") as f:\n    f.write(\"one\\ntwo\\n\")\n\nwith open(\"t.txt\") as f:\n    for line in f:\n        print(line.strip())", "out": "one\ntwo"}, {"h": "שלוש דרכים לקרוא", "t": "<code>read()<\/code> מחזיר את כל הקובץ כמחרוזת אחת. <code>readline()<\/code> מחזיר שורה אחת. <code>readlines()<\/code> מחזיר רשימה של שורות, וכל שורה <b>שומרת את ה-<code>\\n<\/code><\/b>."}, {"h": "שגיאות קבצים ו-pathlib", "t": "קובץ שלא קיים נותן <code>FileNotFoundError<\/code>, שהיא ילדה של <code>OSError<\/code>. <code>pathlib<\/code> נותן דרך נוחה לעבוד עם נתיבים.", "code": "from pathlib import Path\n\np = Path(\"t.txt\")\np.write_text(\"hi\")\nprint(p.exists(), p.name, p.suffix)\n\ntry:\n    open(\"missing.txt\")\nexcept FileNotFoundError:\n    print(\"no file\")", "out": "True t.txt .txt\nno file"}], "id": "io1", "sec": "advanced"}, {"id": "io2", "t": "קבצים: מצבים, bytearray ו-sys", "intro": [{"h": "כל מצבי הפתיחה", "t": "<code>r<\/code> קריאה, <code>w<\/code> כתיבה (מוחק), <code>a<\/code> הוספה, <code>x<\/code> יצירה בלבד: אם הקובץ קיים, נזרקת <code>FileExistsError<\/code>. <code>t<\/code> טקסט (ברירת מחדל), <code>b<\/code> בינארי, <code>+<\/code> קריאה וכתיבה יחד, כמו <code>\"r+\"<\/code> ב-<code>fopen<\/code> של C."}, {"h": "sys.stdin, sys.stdout, sys.stderr", "t": "<b>גשר:<\/b> בדיוק כמו <code>stdin<\/code>, <code>stdout<\/code> ו-<code>stderr<\/code> ב-C. <code>print<\/code> כותב ל-<code>sys.stdout<\/code>, ואפשר לשלוח לערוץ השגיאות עם <code>file=sys.stderr<\/code>.", "code": "import sys\nsys.stdout.write(\"hi\\n\")\nprint(\"err\", file=sys.stderr)", "out": "hi\nerr"}, {"h": "קבצים בינאריים ו-bytearray", "t": "<code>bytes<\/code> לא ניתן לשינוי. <code>bytearray<\/code> כן, כמו מערך <code>unsigned char<\/code> ב-C. במצב <code>\"rb\"<\/code> הקריאה מחזירה <code>bytes<\/code>.", "code": "data = bytearray(3)\ndata[0] = 65\nwith open(\"b.bin\", \"wb\") as f:\n    f.write(data)\nwith open(\"b.bin\", \"rb\") as f:\n    raw = f.read()\nprint(raw, len(raw), raw[0])", "out": "b'A\\x00\\x00' 3 65"}, {"h": "pathlib: עוד כלים", "t": "<code>is_absolute()<\/code> בודק אם הנתיב מלא. <code>resolve()<\/code> הופך נתיב יחסי למלא. <code>read_bytes()<\/code> קורא בייטים, ו-<code>iterdir()<\/code> עובר על קבצים בתיקייה.", "code": "from pathlib import Path\np = Path(\"notes.txt\")\np.write_text(\"abc\")\nprint(p.is_absolute(), p.resolve().is_absolute())\nprint(p.read_bytes())", "out": "False True\nb'abc'"}], "items": [{"id": "n-io2-1", "q": "מה יודפס?", "o": ["exists", "1", "שום דבר", "FileNotFoundError"], "h": ["הקובץ כבר נוצר בשורות הראשונות.", "x נכשל אם הקובץ קיים."], "e": "מצב <code>\"x\"<\/code> יוצר קובץ <b>רק אם הוא לא קיים<\/b>. כאן הוא קיים, ולכן נזרקת <code>FileExistsError<\/code>.", "code": "with open(\"t.txt\", \"w\") as f:\n    f.write(\"1\")\ntry:\n    open(\"t.txt\", \"x\")\nexcept FileExistsError:\n    print(\"exists\")"}, {"id": "n-io2-2", "q": "מה יודפס?", "o": ["bytearray(b'\\x00B')", "b'\\x00B'", "[0, 66]", "bytearray([0, 66])"], "h": ["bytearray(2) הוא שני אפסים.", "66 הוא התו B."], "e": "<code>bytearray(2)<\/code> הוא שני בייטים של 0, ושינינו את השני ל-66, שזה <code>B<\/code>.", "code": "b = bytearray(2)\nb[1] = 66\nprint(b)"}, {"id": "n-io2-3", "q": "לאן print כותב כברירת מחדל?", "o": ["sys.stdout", "sys.stderr", "sys.stdin", "לקובץ output.txt"], "h": ["כמו printf ב-C.", "out = פלט רגיל."], "e": "<code>print<\/code> כותב ל-<code>sys.stdout<\/code>. אפשר לשנות עם הפרמטר <code>file=<\/code>."}, {"id": "n-io2-4", "q": "מה יודפס?", "o": ["'a\\n'", "'a'", "'a\\nb\\n'", "['a\\n']"], "h": ["readline קורא שורה אחת.", "ה-\\n נשאר בסוף השורה."], "e": "<code>readline()<\/code> מחזיר שורה אחת <b>עם<\/b> ה-<code>\\n<\/code>, ו-<code>repr<\/code> מציג אותו.", "code": "with open(\"t.txt\", \"w\") as f:\n    f.write(\"a\\nb\\n\")\nwith open(\"t.txt\") as f:\n    print(repr(f.readline()))"}, {"id": "n-io2-5", "q": "אילו שני מצבים יוצרים קובץ חדש אם הוא לא קיים? (בחר שתיים)", "o": ["\"w\"", "\"a\"", "\"r\"", "\"rb\"", "\"r+\""], "h": ["r תמיד דורש קובץ קיים.", "כתיבה והוספה יוצרות קובץ."], "e": "<code>\"w\"<\/code> ו-<code>\"a\"<\/code> יוצרים קובץ חדש. כל מצב עם <code>r<\/code> זורק <code>FileNotFoundError<\/code> אם הקובץ חסר.", "k": 2}, {"id": "n-io2-6", "q": "מה יודפס?", "o": ["bytearray(b'cb')", "b'cb'", "TypeError", "bytearray(b'ab')"], "h": ["bytearray ניתן לשינוי.", "99 הוא התו c."], "e": "<code>bytearray<\/code> ניתן לשינוי (בניגוד ל-<code>bytes<\/code>), ו-99 הוא <code>c<\/code>.", "code": "b = bytearray(b\"ab\")\nb[0] = 99\nprint(b)"}], "sec": "advanced", "w": "24%"}, {"t": "בדיקות, דיבוג, AI ועבודה בצוות", "w": "14%", "items": [{"c": "ב-<code>unittest<\/code> רק מתודות ששמן מתחיל ב-<code>test<\/code> רצות אוטומטית.", "q": "מתודה בתוך TestCase נקראת check_sum. האם unittest ירוץ אותה?", "o": ["לא, רק שמות שמתחילים ב-test", "כן, כל מתודה רצה", "כן, אבל רק עם דקורטור", "לא, רק מתודות private"], "h": ["איך unittest מזהה בדיקות?", "לפי קידומת בשם."], "e": "<code>unittest<\/code> מחפש מתודות עם קידומת <code>test<\/code>. <code>check_sum<\/code> לא תרוץ.", "id": "11-0"}, {"c": "כש-<code>assertEqual<\/code> נכשל, הבדיקה הזו מסומנת FAIL והשאר ממשיכות לרוץ.", "q": "מה קורה כש-assertEqual נכשל באחת הבדיקות?", "o": ["הבדיקה מסומנת FAIL, והשאר רצות", "כל הבדיקות נעצרות", "התוכנית נסגרת בלי דוח", "הבדיקה מדולגת בשקט"], "h": ["האם בדיקה אחת מפילה את השאר?", "כל בדיקה עצמאית."], "e": "כל בדיקה עצמאית. אחת נכשלת, והדוח בסוף מראה מי נכשלה.", "id": "11-1"}, {"c": "<code>breakpoint()<\/code> עוצר את התוכנית ופותח את הדיבאגר <code>pdb<\/code>.", "q": "מה עושה breakpoint() בקוד?", "o": ["עוצר ופותח את הדיבאגר pdb", "זורק חריגה", "מדפיס את כל המשתנים", "מסיים את התוכנית"], "h": ["מה המטרה: דיבוג.", "אפשר להמשיך בשלבים מתוך הדיבאגר."], "e": "<code>breakpoint()<\/code> פותח את <code>pdb<\/code> בנקודה הזו, ואפשר להריץ שורה אחרי שורה.", "id": "11-2"}, {"c": "קוד מ-AI הוא טיוטה: מריצים, בודקים, ומבינים אותו לפני שמשתמשים.", "q": "קיבלת קוד מכלי AI. מה הכי נכון לעשות?", "o": ["להריץ, לבדוק ולהבין לפני שימוש", "להעתיק ישר לפרויקט", "להניח שהוא נכון כי AI כתב", "למחוק את הבדיקות שלי"], "h": ["האם AI יכול לטעות?", "כל קוד חדש צריך בדיקה."], "e": "AI עלול לטעות. מריצים, בודקים עם דוגמאות, ומוודאים שמבינים כל שורה.", "id": "11-3"}, {"c": "ב-Git: <code>commit<\/code> שומר מקומית, <code>push<\/code> שולח לשרת (remote).", "q": "איזו פקודה שולחת commits מקומיים לשרת?", "o": ["git push", "git commit", "git pull", "git clone"], "h": ["pull מביא, ו-clone מעתיק. מי שולח?", "push = לדחוף החוצה."], "e": "<code>git push<\/code> שולח את ה-commits שלך ל-remote. <code>pull<\/code> מביא שינויים של אחרים.", "id": "11-4"}, {"id": "x-test1-k", "q": "אילו שתי מתודות ירוצו אוטומטית בתוך unittest.TestCase? (בחר שתיים)", "o": ["test_add", "test_empty_list", "check_add", "add_test", "run_add"], "h": ["unittest מחפש קידומת מסוימת בשם.", "השם צריך להתחיל ב-test."], "e": "רק מתודות ששמן <b>מתחיל<\/b> ב-<code>test<\/code> רצות אוטומטית.", "k": 2}], "intro": [{"h": "unittest: בדיקות אוטומטיות", "t": "יורשים מ-<code>unittest.TestCase<\/code>. רק מתודות ששמן מתחיל ב-<code>test<\/code> רצות. נקודה בפלט היא בדיקה שעברה.", "code": "import unittest\n\ndef add(a, b):\n    return a + b\n\nclass TestAdd(unittest.TestCase):\n    def test_small(self):\n        self.assertEqual(add(2, 3), 5)\n    def test_negative(self):\n        self.assertEqual(add(-1, 1), 0)\n\nif __name__ == \"__main__\":\n    unittest.main()", "out": "..\n----------------------------------------------------------------------\nRan 2 tests in 0.000s\n\nOK"}, {"h": "assert-ים נפוצים", "t": "<code>assertEqual<\/code>, <code>assertTrue<\/code>, <code>assertIn<\/code>, ו-<code>assertRaises<\/code> שבודק שנזרקת חריגה. בדיקה שנכשלת מסומנת <code>F<\/code>, והשאר ממשיכות לרוץ.", "code": "class TestDiv(unittest.TestCase):\n    def test_zero(self):\n        with self.assertRaises(ZeroDivisionError):\n            1 / 0"}, {"h": "דיבוג", "t": "<code>breakpoint()<\/code> עוצר ופותח את <code>pdb<\/code>, כמו <code>gdb<\/code> ב-C. פקודות: <code>n<\/code> שורה הבאה, <code>s<\/code> כניסה לפונקציה, <code>c<\/code> המשך, <code>p x<\/code> הדפסת משתנה, <code>q<\/code> יציאה."}, {"h": "עבודה נכונה עם AI", "t": "נותנים הקשר: מה ניסית, הקוד, הודעת השגיאה המלאה. <b>לא<\/b> מדביקים סיסמאות, מפתחות API או מידע אישי. קוד שקיבלת מריצים, בודקים ומבינים לפני שמשתמשים בו."}, {"h": "צוות: Git ו-PEP 8", "t": "Git: <code>clone<\/code> מעתיק, <code>add<\/code> ו-<code>commit<\/code> שומרים מקומית, <code>push<\/code> שולח לשרת, <code>pull<\/code> מביא שינויים. PEP 8: הזחה של 4 רווחים, שמות <code>snake_case<\/code>, ותיעוד עם docstring."}], "id": "test1", "sec": "testing"}, {"id": "test2", "t": "בדיקות ודיבוג לעומק", "intro": [{"h": "שלושה סוגי שגיאות", "t": "<b>
